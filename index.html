function startCombatAfterPrep() {
    gameState = 'COMBAT';
    const logs = {
        TYPING:'TYPE THE WORD TO ATTACK!', MATH:'SOLVE THE PROBLEM!',
        COLOR:'CLICK THE RIGHT COLOR!'
    };
    combat.log = logs[gameConfig.learningMode] || 'ATTACK!';
    scheduleZombieAttack();
}

function scheduleZombieAttack() {
    const attackMs = TIER_CONFIG[gameConfig.playerTier].attackMs;
    combat.zombieNextAt  = performance.now() + attackMs;
    combat.zombieTimerId = setTimeout(zombieAttackTick, attackMs);
}

function stagger() {
    if(!combat.zombie || combat.zombie.hp <= 0) return;
    clearTimeout(combat.zombieTimerId);
    combat.zombieTimerId = null;
    staggerFlash.shownAt = performance.now();
    scheduleZombieAttack();
}

function zombieAttackTick() {
    if (gameState !== 'COMBAT' || !combat.zombie) return;
    const dmg = Math.max(1, run.zombieDmg - player.armorLevel);
    player.hp = Math.max(0, player.hp - dmg);
    combat.playerFlashAt = performance.now();
    combat.log = `ZOMBIE BITES!  YOU TAKE ${dmg} DAMAGE`;
    playCrunch();
    syncHpHud();
    if (player.hp <= 0) {
        clearTimeout(combat.zombieTimerId); combat.zombieTimerId = null;
        gameState = 'GAMEOVER';
    } else {
        scheduleZombieAttack();
    }
}

function playerAttack() {
    if (gameState!=='COMBAT' || !combat.zombie || combat.zombie.hp<=0) return;
    const dmg = player.weapon.damage;
    combat.zombie.hp = Math.max(0, combat.zombie.hp - dmg);
    combat.zombieFlashAt = performance.now();
    combat.log = `YOU STRIKE FOR ${dmg} DAMAGE`;
    playThud();
    if (combat.zombie.hp <= 0) {
        zombies.delete(`${combat.zombie.col},${combat.zombie.row}`);
        clearTimeout(combat.zombieTimerId); combat.zombieTimerId = null;
        player.totalZombiesKilled++;
        mazeZombiesKilledCount++;
        if (zombies.size === 0 && mazeZombieCount > 0) {
            allZombiesKilled = true;
            exterminatorNotif.shownAt = performance.now();
        }
        syncZombiesHud();
        const drop = randInt(CC.zombieGoldMin, CC.zombieGoldMax);
        player.gold += drop;
        const xpGain = 10 + (run.level * 2);
        player.xp += xpGain;
        levelCompleteData.xpGained += xpGain;
        checkLevelUp();
        combat.log = `ZOMBIE DESTROYED!  +${drop}G  +${xpGain}XP`;
        syncGoldHud(); syncXpHud();
        if (combat.zombie.hasKey) {
            player.hasKey = true;
            syncKeyHud();
            combat.log = `🗝️ YOU FOUND THE EXIT KEY!  +${drop}G  +${xpGain}XP`;
            showPopup(`🗝️ KEY FOUND!  +${drop}G  +${xpGain}XP`, 'THE EXIT DOOR IS NOW UNLOCKED', '#ffdd44');
        } else {
            showPopup(`+${drop}G  +${xpGain}XP`, 'LOOTED FROM THE ZOMBIE', C.popupGold);
        }
        playFanfare();
        setTimeout(() => {
            if (gameState==='COMBAT') {
                if (mazeStartTime) mazeStartTime += (performance.now() - battlePrep.startedAt);
                gameState='MAZE'; combat.zombie=null;
            }
        }, CC.killPauseMs);
    } else {
        stagger();
    }
}

function handleTypingInput(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.length !== 1 || !/[a-z]/i.test(e.key)) return;
    e.preventDefault();
    const expected = combat.word[combat.typed.length];
    if (e.key.toLowerCase() === expected) {
        combat.typed += e.key.toLowerCase();
        if (combat.typed === combat.word) {
            playCorrect();
            playerAttack();
            if (gameState === 'COMBAT' && combat.zombie && combat.zombie.hp > 0) {
                pickNewWord();
            }
        }
    } else {
        combat.wrongFlashAt = performance.now();
        // correct prefix is retained — only flash, no reset
        playWrong();
    }
}

function handleMathInput(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    if (e.key === 'Backspace') {
        combat.mathTyped = combat.mathTyped.slice(0,-1);
    } else if (e.key === 'Enter' || e.key === ' ') {
        if (combat.mathTyped.length === 0) return;
        const ans = parseInt(combat.mathTyped, 10);
        if (!isNaN(ans) && ans === combat.mathAnswer) {
            playCorrect();
            playerAttack();
            if (gameState==='COMBAT' && combat.zombie && combat.zombie.hp > 0) pickNewMath();
        } else {
            combat.mathWrongAt = performance.now();
            combat.mathTyped = '';
            playWrong();
        }
    } else if (/^\d$/.test(e.key)) {
        if (combat.mathTyped.length < 7) combat.mathTyped += e.key;
    }
}


function handleCombatClick(mx, my) {
    const mode = gameConfig.learningMode;
    if (mode === 'COLOR') {
        for (const btn of combat.colorButtons) {
            if (mx>=btn.x && mx<=btn.x+btn.w && my>=btn.y && my<=btn.y+btn.h) {
                if (btn.correct) {
                    playCorrect();
                    playerAttack();
                    if (gameState==='COMBAT' && combat.zombie && combat.zombie.hp>0) pickNewColor();
                } else {
                    combat.colorWrongAt = performance.now();
                    playWrong();
                }
                return;
            }
        }
    }
}

function triggerLevelComplete() {
    if (combat.zombieTimerId) { clearTimeout(combat.zombieTimerId); combat.zombieTimerId=null; }
    const elapsed = mazeStartTime ? (performance.now() - mazeStartTime) / 1000 : 999;
    let speedBonus = 0;
    if      (elapsed < 60)  speedBonus = 30;
    else if (elapsed < 90)  speedBonus = 20;
    else if (elapsed < 120) speedBonus = 10;
    if (speedBonus > 0) { player.gold += speedBonus; syncGoldHud(); }
    levelCompleteData.elapsed    = elapsed;
    levelCompleteData.speedBonus = speedBonus;
    levelCompleteData.allZombiesKilled = allZombiesKilled;
    if (allZombiesKilled) {
        player.gold += 40;
        player.xp += 25;
        levelCompleteData.xpGained += 25;
        checkLevelUp();
        syncGoldHud(); syncXpHud();
    }
    const p=computeLevelParams(run.level+1);
    nextLevel.level=run.level+1; nextLevel.gridSize=p.gridSize; nextLevel.cellSize=p.cellSize;
    nextLevel.zombieHp=p.zombieHp; nextLevel.zombieDmg=p.zombieDmg; nextLevel.extraGuards=p.extraGuards;
    gameState='LEVELCOMPLETE';
    saveGame();
}

function buyItem(idx) {
    const goldBefore = player.gold;
    switch (idx) {
        case 0: {
            const wt=getWeaponTierIndex();
            if (wt>=WEAPONS.length-1) return;
            const nw=WEAPONS[wt+1];
            if (player.playerLevel<nw.level||player.gold<nw.cost) return;
            player.gold-=nw.cost;
            player.weapon.name=nw.name; player.weapon.damage=nw.damage;
            syncGoldHud(); syncWeaponHud(); saveGame(); break;
        }
        case 1: {
            const at=player.armorTier;
            if (at>=ARMORS.length-1) return;
            const na=ARMORS[at+1];
            if (player.playerLevel<na.level||player.gold<na.cost) return;
            player.gold-=na.cost;
            player.armorTier++; player.armorLevel=ARMORS[player.armorTier].defense;
            syncGoldHud(); syncArmorHud(); saveGame(); break;
        }
        case 2: {
            if (player.potions>=5||player.gold<20) return;
            player.gold-=20; player.potions++;
            syncGoldHud(); syncPotionsHud(); saveGame(); break;
        }
        case 3: {
            if (player.gold<60) return;
            player.gold-=60; player.maxHp+=10;
            player.hp=Math.min(player.maxHp, player.hp+10);
            syncHpHud(); syncGoldHud(); saveGame(); break;
        }
    }
    if (player.gold !== goldBefore) {
        shopUi.goldFlashFrom = goldBefore;
        shopUi.goldFlashAt = performance.now();
    }
}

//  CHICKEN + REPELLENT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function useChicken() {
    if (player.chickens <= 0) return;
    if (gameState !== 'COMBAT' && gameState !== 'BATTLEPREP') return;
    player.chickens--;
    const mode = gameConfig.learningMode;
    if (mode === 'TYPING') {
        const easierTier = Math.max(0, gameConfig.playerTier - 1);
        combat.word = getWordForTier(easierTier);
        combat.typed = '';
        combat.wrongFlashAt = -Infinity;
    } else if (mode === 'MATH') {
        pickNewMath();
    } else if (mode === 'COLOR') {
        pickNewColor();
    }
    clearTimeout(combat.zombieTimerId);
    if (gameState === 'COMBAT') scheduleZombieAttack();
    combat.log = '🐔 CHICKEN USED! New challenge incoming!';
    syncChickensHud();
}

function useRepellent() {
    if (player.repellents <= 0) return;
    if (gameState !== 'BATTLEPREP') return;
    if (battlePrep.zombie && battlePrep.zombie.hasKey) return;
    player.repellents--;
    const key = `${battlePrep.zombie.col},${battlePrep.zombie.row}`;
    repelledCells.add(key);
    clearTimeout(combat.zombieTimerId);
    combat.zombie = null;
    battlePrep.zombie = null;
    gameState = 'MAZE';
    combat.log = '';
    syncRepellentsHud();
}

function buildWeaponsTab() {
    const WEAPON_ICONS = ['🪵','🗡️','🔪','⚔️','🗡️','🌙','✨'];
    const cur = getWeaponTierIndex();
    const page = shopUi.page;
    const start = page * 4;
    const items = [];
    for (let i = start; i < Math.min(start + 4, WEAPONS.length); i++) {
        const w = WEAPONS[i];
        let status, statLine, statColor;
        if (i < cur) {
            status = 'owned';
            statLine = '✅ ' + w.damage + ' DMG  (past)';
            statColor = '#44ff88';
        } else if (i === cur) {
            status = 'owned';
            statLine = '✅ ' + w.damage + ' DMG  (current)';
            statColor = '#44ff88';
        } else if (i === cur + 1) {
            if (player.playerLevel < w.level) { status = 'locked_level'; }
            else { status = player.gold >= w.cost ? 'buyable' : 'locked_cost'; }
            statLine = '⚔️ Damage: +' + (w.damage - player.weapon.damage) + ' ▲';
            statColor = '#44ff88';
        } else {
            status = 'locked_level';
            statLine = '⚔️ Damage: +' + (w.damage - player.weapon.damage) + ' ▲';
            statColor = '#44ff88';
        }
        items.push({
            icon: WEAPON_ICONS[i] || '⚔️',
            name: w.name,
            statLine, statColor,
            cost: i <= cur ? 0 : w.cost,
            status,
            levelReq: w.level,
            lockMsg: player.playerLevel < w.level ? `Reach Level ${w.level} to unlock` : 'Buy the weapon before this first',
            countLine: '',
            shimmer: status === 'buyable',
        });
    }
    return items;
}

function buildArmorTab() {
    const ARMOR_ICONS = ['🧥','🦺','⛓️','🛡️','🔩','✨'];
    const cur = player.armorTier;

            statColor = '#44ff88';

            if (player.playerLevel < a.level) { status = 'locked_level'; }

            statLine = '🛡️ Damage taken: -' + (a.defense - ARMORS[cur].defense) + ' ▼';
            statColor = '#44ff88';
        } else {
            status = 'locked_level';
            statLine = '🛡️ Damage taken: -' + (a.defense - ARMORS[cur].defense) + ' ▼';
            statColor = '#44ff88';
        }
        items.push({
            icon: ARMOR_ICONS[i] || '🛡️',
            name: a.name,
            statLine, statColor,
            cost: i <= cur ? 0 : a.cost,
            status,
            levelReq: a.level,
            lockMsg: player.playerLevel < a.level ? `Reach Level ${a.level} to unlock` : 'Buy the armor before this first',
            countLine: '',
            shimmer: status === 'buyable',
        });
    }
    return items;
}

function buildUpgradesTab() {
    const TORCH_TIERS = [
        { name:'Candle 🕯️',  cost:50,  bonus:'+0.5 vision', tier:1 },
        { name:'Lantern 🔦', cost:200, bonus:'+1.0 vision', tier:2 },

    const TORCH_ICONS = ['🕯️','🔦','🔥'];
    const visionDelta = [0.5, 1.0, 1.5];
    const items = [];
    for (let idx = 0; idx < TORCH_TIERS.length; idx++) {
        const torch = TORCH_TIERS[idx];
        const t = torch.tier;
        let status;
        if (player.torchTier >= t) {
            status = 'owned';
        } else if (player.torchTier === t - 1) {
            status = player.gold >= torch.cost ? 'buyable' : 'locked_cost';

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  NEW SHOP: buyCurrentItem
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function buyCurrentItem() {
    const items = getTabItems();
    const idx = shopUi.selectedCard;
    const item = items[idx];
    if (!item || item.status !== 'buyable') return;
    const goldBefore = player.gold;

    switch (shopUi.tab) {
        case 'WEAPONS': {
            const wt = getWeaponTierIndex();
            if (wt >= WEAPONS.length - 1) return;
            const nw = WEAPONS[wt + 1];
            if (player.playerLevel < nw.level || player.gold < nw.cost) return;
            player.gold -= nw.cost;
            player.weapon.name = nw.name; player.weapon.damage = nw.damage;
            syncGoldHud(); syncWeaponHud(); break;
        }
        case 'ARMOR': {
            const at = player.armorTier;
            if (at >= ARMORS.length - 1) return;
            const na = ARMORS[at + 1];
            if (player.playerLevel < na.level || player.gold < na.cost) return;
            player.gold -= na.cost;
            player.armorTier++; player.armorLevel = ARMORS[player.armorTier].defense;
            syncGoldHud(); syncArmorHud(); break;
        }
        case 'ITEMS': {
            if (idx === 0) {
                if (player.potions >= 5 || player.gold < 20) return;
                player.gold -= 20; player.potions++;
                syncGoldHud(); syncPotionsHud();
            } else if (idx === 1) {
                if (player.chickens >= 3 || player.gold < 100) return;
                player.gold -= 100; player.chickens++;
                syncGoldHud(); syncChickensHud();
            } else if (idx === 2) {
                if (player.repellents >= 2 || player.gold < 140) return;
                player.gold -= 140; player.repellents++;
                syncGoldHud(); syncRepellentsHud();
            } else if (idx === 3) {
                const rf = player.rabbitFeet;
                const rfCosts = [100, 200, 300, 500, 750];
                if (rf >= 5) return;
                const cost = rfCosts[rf];
                if (player.gold < cost) return;
                player.gold -= cost; player.rabbitFeet++;
                syncGoldHud(); syncRabbitFeetHud();
            }
            break;
        }
        case 'UPGRADES': {
            const t = idx + 1;
            if (player.torchTier !== t - 1) return;
            const cost = [50, 200, 600][idx];
            if (cost === undefined || player.gold < cost) return;
            player.gold -= cost;
            player.torchTier = t;
            syncGoldHud(); syncTorchHud(); break;
        }
    }

    if (player.gold !== goldBefore) {
        shopUi.goldFlashFrom = goldBefore;
        shopUi.goldFlashAt = performance.now();
    }
    saveGame();
}

//  3-SLOT SAVE SYSTEM
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const SAVES_KEY = 'deadEnds_saves';

function loadAllSlots() {
    try {
        const raw = localStorage.getItem(SAVES_KEY);
        if (!raw) return [null,null,null];
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [null,null,null];
        while (arr.length < 3) arr.push(null);
        return arr.slice(0,3);
    } catch(e) { return [null,null,null]; }
}

function saveAllSlots(arr) {
    try { localStorage.setItem(SAVES_KEY, JSON.stringify(arr)); } catch(e) {}
}

function getCurrentSaveLevel() {
    if (gameState==='LEVELCOMPLETE'||gameState==='SHOP') return nextLevel.level;
    return run.level;
}

function saveGame() {
    try {
        const arr = loadAllSlots();
        const existing = arr[gameConfig.currentSlot] || {};
        arr[gameConfig.currentSlot] = {
            name:          existing.name     || 'Adventurer',
            createdAt:     existing.createdAt || Date.now(),
            lastPlayed:    Date.now(),
            playerTier:    gameConfig.playerTier,
            learningMode:  gameConfig.learningMode,
            character:     gameConfig.character,
            playerLevel:   player.playerLevel,
            currentXP:     player.xp,
            gold:          player.gold,
            maxHp:         player.maxHp,
            weaponName:    player.weapon.name,
            weaponDamage:  player.weapon.damage,
            armorTier:     player.armorTier,
            armorLevel:    player.armorLevel,
            potionCount:   player.potions,
            mazeLevel:     getCurrentSaveLevel(),
            totalZombiesKilled: player.totalZombiesKilled,
            chickens:      player.chickens,
            repellents:    player.repellents,
            rabbitFeet:    player.rabbitFeet,
            torchTier:     player.torchTier,
        };
        saveAllSlots(arr);
        saveFlash.shownAt = performance.now();
    } catch(e) {}
}


function applySaveData(data) {
    player.playerLevel        = data.playerLevel   || 1;
    player.xp                 = data.currentXP     || 0;
    player.gold               = data.gold          || 0;
    player.maxHp              = data.maxHp         || CC.playerMaxHp;
    player.hp                 = player.maxHp;
    player.weapon.name        = data.weaponName    || CC.startWeapon.name;
    player.weapon.damage      = data.weaponDamage  || CC.startWeapon.damage;
    player.armorTier          = data.armorTier     || 0;
    player.armorLevel         = data.armorLevel    || 0;
    player.potions            = data.potionCount   || 0;
    player.totalZombiesKilled = data.totalZombiesKilled || 0;
    player.chickens           = data.chickens      || 0;
    player.repellents         = data.repellents    || 0;
    player.rabbitFeet         = data.rabbitFeet    || 0;
    player.torchTier          = data.torchTier     || 0;
    const lvl = data.mazeLevel || 1;
    const p   = computeLevelParams(lvl);
    run.level=lvl; run.zombieHp=p.zombieHp; run.zombieDmg=p.zombieDmg; run.extraGuards=p.extraGuards;
    GS=p.gridSize; CS=p.cellSize;
    gameConfig.playerTier   = data.playerTier   || 0;
    gameConfig.learningMode = data.learningMode || 'TYPING';
    gameConfig.character    = data.character    || CHARACTERS[0].id;
}

function launchGame(slotIdx) {

    applySaveData(data);
    getAudio();

    resizeUiToCanvas();
    currentMaze=new Maze(GS);
    player.col=0; player.row=0;
    initLevel();
    clearTimeout(popup._timer); sparkles=[];
    combat.zombie=null; combat.playerFlashAt=-Infinity; combat.zombieFlashAt=-Infinity;
    levelUpNotif.shownAt=-Infinity;
    levelCompleteData.xpGained=0; levelCompleteData.levelsGained=0; levelCompleteData.allZombiesKilled=false;
    mazeStartTime=performance.now();
    gameState='MAZE';
    syncLevelHud(); syncHpHud(); syncGoldHud(); syncXpHud(); syncPotionsHud(); syncPlayerLevelHud();

function checkLevelUp() {
    const prevLevel = player.playerLevel;
    let needed = xpToNextLevel(player.playerLevel);
    while (player.xp >= needed) {
        player.xp -= needed;
        player.playerLevel++;
        levelUpNotif.shownAt = performance.now();
        needed = xpToNextLevel(player.playerLevel);
    }
    if (player.playerLevel > prevLevel) {
        levelCompleteData.levelsGained += player.playerLevel - prevLevel;
    }
    syncXpHud(); syncPlayerLevelHud();
}

function usePotion() {
    if (player.potions <= 0) return;
    if (player.hp >= player.maxHp) { showPopup('AT FULL HEALTH', 'SAVE YOUR POTION', C.popupPotion); return; }
    const healed = Math.min(20, player.maxHp - player.hp);
    player.hp += healed; player.potions--;
    syncHpHud(); syncPotionsHud();
    showPopup(`+${healed} HP`, 'POTION CONSUMED', C.popupPotion);
}

function drawExterminatorNotif(now) {
    const elapsed = now - exterminatorNotif.shownAt;
    if (elapsed >= exterminatorNotif.duration) return;
    const fadeStart = exterminatorNotif.duration - 500;
    const alpha = elapsed > fadeStart ? (1 - (elapsed - fadeStart) / 500) : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = '28px VT323, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ff8800'; ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 18;
    ctx.fillText('🧟 EXTERMINATOR! All zombies slain!', canvas.width / 2, canvas.height / 2 - 60);
    ctx.shadowBlur = 0;
    ctx.restore();
}

function drawLevelUpNotif(now) {
    const elapsed = now - levelUpNotif.shownAt;
    if (elapsed >= levelUpNotif.duration) return;
    const fadeStart = levelUpNotif.duration - 400;
    const alpha = elapsed > fadeStart ? (1-(elapsed-fadeStart)/400) : 1;
    const pulse = 0.85 + 0.15*Math.sin(now*0.015);
    ctx.save();
    ctx.globalAlpha = alpha * pulse;
    ctx.font = '36px VT323, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffdd00'; ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 22;
    ctx.fillText(`LEVEL UP!  PLAYER LEVEL ${player.playerLevel}`, canvas.width/2, canvas.height/2-16);
    ctx.shadowBlur = 0;
    ctx.restore();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  INPUT HANDLERS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const KEY_MOVES = {
    w:          { wall:'N', dc:0,  dr:-1, facing:'north' },
    ArrowUp:    { wall:'N', dc:0,  dr:-1, facing:'north' },
    a:          { wall:'W', dc:-1, dr:0,  facing:'west'  },
    ArrowLeft:  { wall:'W', dc:-1, dr:0,  facing:'west'  },
    s:          { wall:'S', dc:0,  dr:1,  facing:'south' },
    ArrowDown:  { wall:'S', dc:0,  dr:1,  facing:'south' },
    d:          { wall:'E', dc:1,  dr:0,  facing:'east'  },
    ArrowRight: { wall:'E', dc:1,  dr:0,  facing:'east'  },
};

window.addEventListener('keydown', e => {

    // ── SLOT SELECT ──────────────────────────────────────────────
    if (gameState === 'SLOTSELECT') {
        if (slotSelectUi.deleteConfirmSlot >= 0) {
            if (e.key==='Escape') { slotSelectUi.deleteConfirmSlot=-1; }
            return;
        }
        if (e.key==='ArrowLeft'||e.key==='a'||e.key==='A') {
            setupFlow.selectedSlot = (setupFlow.selectedSlot+2) % 3;
        } else if (e.key==='ArrowRight'||e.key==='d'||e.key==='D') {
            setupFlow.selectedSlot = (setupFlow.selectedSlot+1) % 3;
        } else if (e.key>='1'&&e.key<='3') {
            setupFlow.selectedSlot = parseInt(e.key,10)-1;
        } else if (e.key==='Enter'||e.key===' ') {
            openSlot(setupFlow.selectedSlot);
        }
        return;
    }

    // ── CHARACTER SELECT ─────────────────────────────────────────
    if (gameState === 'CHARSELECT') {
        const N=CHARACTERS.length;
        if (e.key==='Escape') { gameState='SLOTSELECT'; setupFlow.slotAnimStart=performance.now(); return; }
        if (e.key==='ArrowLeft'||e.key==='a') setupFlow.charSelectedIdx=(setupFlow.charSelectedIdx+N-1)%N;
        else if (e.key==='ArrowRight'||e.key==='d') setupFlow.charSelectedIdx=(setupFlow.charSelectedIdx+1)%N;
        else if (e.key>='1'&&e.key<=String(N)) setupFlow.charSelectedIdx=parseInt(e.key,10)-1;
        else if (e.key==='Enter'||e.key===' ') confirmCharSelect();
        return;
    }

    // ── TIER SELECT ──────────────────────────────────────────────
    if (gameState === 'TIERSELECT') {
        if (e.key==='Escape') { gameState='CHARSELECT'; setupFlow.slotAnimStart=performance.now(); return; }
        if (e.key==='ArrowLeft') setupFlow.tierSelectedIdx=(setupFlow.tierSelectedIdx+3)%4;
        else if (e.key==='ArrowRight') setupFlow.tierSelectedIdx=(setupFlow.tierSelectedIdx+1)%4;
        else if (e.key>='1'&&e.key<='4') setupFlow.tierSelectedIdx=parseInt(e.key,10)-1;
        else if (e.key==='Enter') {
            setupFlow.slotAnimStart=performance.now();
            gameState='MODESELECT';
        }
        return;
    }

    // ── MODE SELECT ──────────────────────────────────────────────
    if (gameState === 'MODESELECT') {
        const N=LEARNING_MODES.length;
        if (e.key==='Escape') {
            if (setupFlow.isExistingSlot) { gameState='CHARSELECT'; setupFlow.slotAnimStart=performance.now(); }
            else { gameState='TIERSELECT'; setupFlow.slotAnimStart=performance.now(); }
            return;
        }
        if (e.key==='ArrowLeft') setupFlow.modeSelectedIdx=(setupFlow.modeSelectedIdx+N-1)%N;
        else if (e.key==='ArrowRight') setupFlow.modeSelectedIdx=(setupFlow.modeSelectedIdx+1)%N;
        else if (e.key>='1'&&e.key<=String(N)) setupFlow.modeSelectedIdx=parseInt(e.key,10)-1;
        else if (e.key==='Enter') {
            const modeId=LEARNING_MODES[setupFlow.modeSelectedIdx].id;
            if (setupFlow.isExistingSlot) {
                getAudio(); launchGameWithMode(setupFlow.targetSlot, modeId);
            } else {
                setupFlow.name='';
                gameState='NAMING';
            }
        }
        return;
    }

    // ── NAMING ───────────────────────────────────────────────────
    if (gameState === 'NAMING') {
        if (e.key==='Escape') { gameState='MODESELECT'; return; }
        if (e.key==='Enter') {
            if (setupFlow.name.trim().length === 0) setupFlow.name='Adventurer';
            startNewSlot(setupFlow.targetSlot, setupFlow.name.trim(),
                setupFlow.tierSelectedIdx, LEARNING_MODES[setupFlow.modeSelectedIdx].id);
            return;
        }
        if (e.key==='Backspace') { setupFlow.name=setupFlow.name.slice(0,-1); return; }
        if (e.key.length===1 && /[a-zA-Z0-9 ]/.test(e.key) && setupFlow.name.length<20) {
            setupFlow.name += e.key;
        }
        return;
    }

    // ── PAUSED ───────────────────────────────────────────────────
    if (gameState === 'PAUSED') {
        if (e.key==='r'||e.key==='R'||e.key==='Escape') {
            if (mazeStartTime) mazeStartTime += (performance.now() - pauseStartTime);
            gameState='MAZE';
        } else if (e.key==='q'||e.key==='Q') {
            saveGame();
            gameState='SLOTSELECT';
            setupFlow.slotAnimStart=performance.now();
        }
        return;
    }

    // ── GAME OVER ────────────────────────────────────────────────
    if (gameState === 'GAMEOVER') {
        if (e.key==='r'||e.key==='R') { restart(); return; }
        if (e.key==='m'||e.key==='M'||e.key==='Escape') {
            gameState='SLOTSELECT';
            setupFlow.slotAnimStart=performance.now();
        }
        return;
    }

    if (gameState === 'LEVELCOMPLETE') {
        if (e.key==='Enter'||e.key===' ') enterShop();
        return;
    }
    if (gameState === 'SHOP') {
        if (shopUi.oopsConfirm) {
            if (e.key==='y'||e.key==='Y') { applyOopsReset(); return; }
            if (e.key==='n'||e.key==='N'||e.key==='Escape') { shopUi.oopsConfirm=false; return; }
            return;
        }
        const TABS_ORDER = ['WEAPONS','ARMOR','ITEMS','UPGRADES'];
        if (e.key==='ArrowLeft') {
            const ti = TABS_ORDER.indexOf(shopUi.tab);
            shopUi.tab = TABS_ORDER[(ti + 3) % 4];
            shopUi.page = 0; shopUi.selectedCard = 0; return;
        }
        if (e.key==='ArrowRight') {
            const ti = TABS_ORDER.indexOf(shopUi.tab);
            shopUi.tab = TABS_ORDER[(ti + 1) % 4];
            shopUi.page = 0; shopUi.selectedCard = 0; return;
        }
        if (e.key==='ArrowUp') {
            shopUi.selectedCard = (shopUi.selectedCard + 3) % 4; return;
        }
        if (e.key==='ArrowDown') {
            shopUi.selectedCard = (shopUi.selectedCard + 1) % 4; return;
        }
        if (e.key>='1'&&e.key<='4') {
            shopUi.selectedCard = parseInt(e.key,10)-1;
            buyCurrentItem(); return;
        }
        if (e.key==='Enter') { buyCurrentItem(); return; }
        if (e.key===' ') { beginNextLevel(); return; }
        if (e.key==='PageUp'||e.key===',') {
            if (shopUi.page > 0) { shopUi.page--; shopUi.selectedCard=0; } return;
        }
        if (e.key==='PageDown'||e.key==='.') {
            const total = shopUi.tab==='WEAPONS' ? WEAPONS.length : shopUi.tab==='ARMOR' ? ARMORS.length : 4;
            const maxPage = Math.ceil(total/4)-1;
            if (shopUi.page < maxPage) { shopUi.page++; shopUi.selectedCard=0; } return;
        }
        return;
    }

    if (gameState === 'BATTLEPREP') return;

    if (gameState === 'COMBAT') {
        const mode = gameConfig.learningMode;
        if (mode==='TYPING')  handleTypingInput(e);
        else if (mode==='MATH') handleMathInput(e);
        return;
    }

    if (gameState !== 'MAZE') return;

    if (e.key==='Escape') {
        e.preventDefault();
        pauseStartTime = performance.now();
        gameState = 'PAUSED';
        return;
    }
    if (e.key==='f'||e.key==='F') { e.preventDefault(); usePotion(); return; }

    const move=KEY_MOVES[e.key];
    if (!move) return;
    e.preventDefault();
    player.facing = move.facing;

    const cell=currentMaze.cell(player.col, player.row);
    if (!cell || cell.walls[move.wall]) return;

    const vp=getPlayerVisualPos(performance.now());
    playerAnim.fromCol=vp.col; playerAnim.fromRow=vp.row;
    player.col+=move.dc; player.row+=move.dr;
    playerAnim.toCol=player.col; playerAnim.toRow=player.row;
    playerAnim.startTime=performance.now();

    updateFogVisited();

    const newKey=`${player.col},${player.row}`;
    const zombie=zombies.get(newKey);
    const chest =chests.get(newKey);

    if (zombie && !repelledCells.has(newKey)) {
        enterCombat(zombie);
    } else if (chest) {
        openChest(newKey, player.col, player.row);
    } else if (player.col===currentMaze.exitCol && player.row===currentMaze.exitRow) {
        if (player.hasKey) triggerLevelComplete();
        else { showPopup('🔒 THE DOOR IS LOCKED', 'ONE OF THE ZOMBIES HAS THE KEY - DEFEAT THEM TO FIND IT', '#ff6666'); playWrong(); }
    }
});

canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top)  * (canvas.height / rect.height);

    if (gameState==='COMBAT') {
        // Chicken button
        if (combat.chickenRect) {
            const r = combat.chickenRect;
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) { useChicken(); return; }
        }
        if (gameConfig.learningMode==='COLOR') { handleCombatClick(mx, my); return; }
        return;
    }
    if (gameState==='BATTLEPREP') {
        if (battlePrep.repellentRect) {
            const r = battlePrep.repellentRect;
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) { useRepellent(); return; }
        }
        return;
    }
    if (gameState==='SLOTSELECT') {
        // Delete confirm overlay takes priority
        if (slotSelectUi.deleteConfirmSlot >= 0) {
            if (slotSelectUi.deleteYesRect) {
                const r=slotSelectUi.deleteYesRect;
                if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) {
                    const arr=loadAllSlots(); arr[slotSelectUi.deleteConfirmSlot]=null; saveAllSlots(arr);
                    slotSelectUi.deleteConfirmSlot=-1; return;
                }
            }
            if (slotSelectUi.deleteCancelRect) {
                const r=slotSelectUi.deleteCancelRect;
                if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) {
                    slotSelectUi.deleteConfirmSlot=-1; return;
                }
            }
            slotSelectUi.deleteConfirmSlot=-1; return;
        }
        // Trash buttons first (higher priority than card body)
        for(let i=0;i<3;i++){
            const tr=slotSelectUi.trashRects[i];
            if(tr&&mx>=tr.x&&mx<=tr.x+tr.w&&my>=tr.y&&my<=tr.y+tr.h){
                slotSelectUi.deleteConfirmSlot=i; return;
            }
        }
        // Card body — single click to load/create
        for(let i=0;i<3;i++){
            const cr=slotSelectUi.cardRects[i];
            if(cr&&mx>=cr.x&&mx<=cr.x+cr.w&&my>=cr.y&&my<=cr.y+cr.h){
                openSlot(i);
                return;
            }
        }
        return;
    }
    if (gameState==='CHARSELECT') {
        for(let i=0;i<setupFlow.charCardRects.length;i++){
            const r=setupFlow.charCardRects[i];
            if(r&&mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){
                setupFlow.charSelectedIdx=i;
                confirmCharSelect();
                return;
            }
        }
        return;
    }
    if (gameState==='TIERSELECT') {
        for(let i=0;i<setupFlow.tierCardRects.length;i++){
            const r=setupFlow.tierCardRects[i];
            if(r&&mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){
                setupFlow.tierSelectedIdx=i;
                setupFlow.slotAnimStart=performance.now();
                gameState='MODESELECT';
                return;
            }
        }
        return;
    }
    if (gameState==='MODESELECT') {
        for(let i=0;i<setupFlow.modeCardRects.length;i++){
            const r=setupFlow.modeCardRects[i];
            if(r&&mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){
                setupFlow.modeSelectedIdx=i; return;
            }
        }
        if(setupFlow.modeStartRect){
            const r=setupFlow.modeStartRect;
            if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){
                const modeId=LEARNING_MODES[setupFlow.modeSelectedIdx].id;
                if(setupFlow.isExistingSlot){ getAudio(); launchGameWithMode(setupFlow.targetSlot,modeId); }
                else { setupFlow.name=''; gameState='NAMING'; }
                return;
            }
        }
        return;
    }
    if (gameState==='PAUSED') {
        if (uiRects.pauseResume) {
            const r=uiRects.pauseResume;
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) {
                if (mazeStartTime) mazeStartTime += (performance.now() - pauseStartTime);
                gameState='MAZE'; return;
            }
        }
        if (uiRects.pauseQuit) {
            const r=uiRects.pauseQuit;
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) {
                saveGame(); gameState='SLOTSELECT'; setupFlow.slotAnimStart=performance.now(); return;
            }
        }
        return;
    }
    if (gameState==='GAMEOVER') {
        if (uiRects.gameOverRetry) {
            const r=uiRects.gameOverRetry;
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) { restart(); return; }
        }
        if (uiRects.gameOverMenu) {
            const r=uiRects.gameOverMenu;
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) {
                gameState='SLOTSELECT'; setupFlow.slotAnimStart=performance.now(); return;
            }
        }
        return;
    }
    if (gameState==='LEVELCOMPLETE') {
        if (uiRects.levelCompleteShop) {
            const r=uiRects.levelCompleteShop;
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) { enterShop(); return; }
        }
        return;
    }
    if (gameState==='SHOP') {
        if (shopUi.oopsConfirm) {
            if (shopUi.confirmYesRect) {
                const r=shopUi.confirmYesRect;
                if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) { applyOopsReset(); return; }
            }
            if (shopUi.confirmNoRect) {
                const r=shopUi.confirmNoRect;
                if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) { shopUi.oopsConfirm=false; return; }
            }
            shopUi.oopsConfirm=false; return;
        }
        // Tab clicks
        for (const tr of shopUi.tabRects) {
            if (mx>=tr.x&&mx<=tr.x+tr.w&&my>=tr.y&&my<=tr.y+tr.h) {
                shopUi.tab=tr.id; shopUi.page=0; shopUi.selectedCard=0; return;
            }
        }
        // Pagination
        if (shopUi.prevPageRect) {
            const r=shopUi.prevPageRect;
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) {
                if (shopUi.page>0) { shopUi.page--; shopUi.selectedCard=0; } return;
            }
        }
        if (shopUi.nextPageRect) {
            const r=shopUi.nextPageRect;
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) {
                const total = shopUi.tab==='WEAPONS' ? WEAPONS.length : shopUi.tab==='ARMOR' ? ARMORS.length : 4;
                const maxPage = Math.ceil(total/4)-1;
                if (shopUi.page<maxPage) { shopUi.page++; shopUi.selectedCard=0; } return;
            }
        }
        // Card clicks
        for (const r of shopUi.cardRects) {
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) {
                shopUi.selectedCard=r.idx; buyCurrentItem(); return;
            }
        }
        if (shopUi.oopsRect) {
            const r=shopUi.oopsRect;
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) {
                if (hasMadePurchase()) shopUi.oopsConfirm=true;
                return;
            }
        }
        if (shopUi.nextLevelRect) {
            const r=shopUi.nextLevelRect;
            if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) { beginNextLevel(); return; }
        }
        return;
    }
});

    const rect=canvas.getBoundingClientRect();
    shopUi.hoverX=(e.clientX-rect.left)*(canvas.width/rect.width);
    shopUi.hoverY=(e.clientY-rect.top)*(canvas.height/rect.height);

    clearTimeout(popup._timer);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  GAME LOOP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let _lastTimerSec = -1;
function gameLoop(now) {
    if (mazeStartTime && gameState==='MAZE') {
        const sec = Math.floor((now - mazeStartTime) / 1000);
        if (sec !== _lastTimerSec) { _lastTimerSec = sec; syncTimerHud(sec); }
    }

    if (gameState==='BATTLEPREP') {
        const elapsed = now - battlePrep.startedAt;
        renderMaze(currentMaze, player, zombies, chests, now);
        renderBattlePrep(now);
        if (elapsed >= 3500) startCombatAfterPrep();
    }
    else if (gameState==='SLOTSELECT')     renderSlotSelect(now);
    else if (gameState==='CHARSELECT')     renderCharSelect(now);
    else if (gameState==='TIERSELECT')     renderTierSelect(now);
    else if (gameState==='MODESELECT')     renderModeSelect(now);
    else if (gameState==='NAMING')         renderNaming(now);
    else if (gameState==='MAZE')           renderMaze(currentMaze,player,zombies,chests,now);
    else if (gameState==='COMBAT')       { renderMaze(currentMaze,player,zombies,chests,now); renderCombat(player,combat,now); }
    else if (gameState==='LEVELCOMPLETE'){ renderMaze(currentMaze,player,zombies,chests,now); renderLevelComplete(now); }
    else if (gameState==='SHOP')           renderShop(now);
    else if (gameState==='GAMEOVER')       renderGameOver(now);
    else if (gameState==='PAUSED')       { renderMaze(currentMaze,player,zombies,chests,now); renderPaused(now); }

    if (gameState==='MAZE'||gameState==='COMBAT'||gameState==='PAUSED'||gameState==='LEVELCOMPLETE') {
        drawSaveFlash(now);
    }

    requestAnimationFrame(gameLoop);
}

document.fonts.ready.then(() => {
    setupFlow.slotAnimStart = performance.now();
    resizeUiToCanvas();
    syncLevelHud(); syncHpHud(); syncGoldHud();
    syncXpHud(); syncPotionsHud(); syncPlayerLevelHud();
    syncWeaponHud(); syncArmorHud(); syncZombiesHud();
    requestAnimationFrame(gameLoop);
});
