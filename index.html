        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #020502;
            color: #00ff41;
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-title {
            font-size: 54px;
            letter-spacing: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 20px #00ff41, 0 0 50px rgba(0,255,65,0.25);
            margin-bottom: 4px;
        }

        #hp-bar-outer {
            position: relative;
            height: 24px;
            background: #0a0a0a;
            border: 1px solid #003311;
            margin-bottom: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }
        #hp-bar-fill {
            height: 100%;
            background: #00bb33;
            width: 100%;
            transition: width 0.15s, background-color 0.2s;
        }
        #hp-bar-text {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            font-family: 'VT323', monospace;
            font-size: 16px;
            color: #ccffcc;
            letter-spacing: 1px;
            pointer-events: none;
        }

        #canvas-container { position: relative; }

        #canvas-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px, transparent 2px,
                rgba(0,0,0,0.10) 2px, rgba(0,0,0,0.10) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        canvas {
            display: block;
            border: 1px solid #002211;
            box-shadow:
                0 0 0 1px #001a0a,
                0 0 40px rgba(0,255,65,0.08),
                inset 0 0 40px rgba(0,0,0,0.9);
            cursor: crosshair;
        }

        #stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px 8px;
            padding: 5px 2px;
            margin-top: 4px;
            font-size: 14px;
            color: #2a6b2a;
            letter-spacing: 1px;
        }
        .stat-cell {
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(0,8,0,0.5);
            border: 1px solid #0a200a;
            padding: 2px 7px;
        }
        .stat-cell span { color: #00cc33; }
        .stat-cell.key-cell { grid-column: 1 / -1; justify-content: center; }
        .stat-cell.key-cell.found { border-color: #aa8800; }
        .stat-cell.key-cell.found span { color: #ffdd44; }

        #loot-popup {
            display: flex;
            visibility: hidden;
            margin-top: 8px;
            width: 100%;
            max-width: 556px;
            min-height: 56px;
            background: rgba(3,10,3,0.97);
            border: 1.5px solid #00ff41;
            box-shadow: 0 0 14px rgba(0,255,65,0.3);
            padding: 10px 18px;
            text-align: center;
            cursor: pointer;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        #loot-popup.visible { visibility: visible; }
        #loot-popup #loot-title {
            font-size: 26px;
            font-family: 'VT323', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 8px currentColor;
        }
        #loot-popup #loot-sub {
            font-size: 14px;
            color: #556655;
            font-family: 'VT323', monospace;

function getWordForLevel(level) {
    let minLen, maxLen;
    if      (level <= 2)  { minLen = 2; maxLen = 2; }
    else if (level <= 5)  { minLen = 1; maxLen = 3; }
    else if (level <= 10) { minLen = 4; maxLen = 5; }
    else if (level <= 15) { minLen = 5; maxLen = 6; }
    else                  { minLen = 6; maxLen = 8; }
    const pool = WORDS.filter(w => w.length >= minLen && w.length <= maxLen);
    return pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : 'hit';
}

function getWordForTier(tier) {
    const mins = [2, 3, 4, 5];
    const maxs = [3, 4, 6, 8];
    const min = mins[tier] || 2, max = maxs[tier] || 4;
    const pool = WORDS.filter(w => w.length >= min && w.length <= max);
    return pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : 'hit';
}

function xpToNextLevel(lvl) {
    const table = [30, 70, 130, 200, 270, 350];
    if (lvl <= table.length) return table[lvl - 1];
    return table[table.length - 1] + (lvl - table.length) * 80;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CELL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
class Cell {
    constructor(col, row) {
        this.col = col; this.row = row;
        this.walls     = { N: true, S: true, E: true, W: true };
        this.visited   = false;
        this.isDeadEnd = false;
    }
    get openPassages() {
        return (this.walls.N?0:1)+(this.walls.S?0:1)+(this.walls.E?0:1)+(this.walls.W?0:1);
    }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  MAZE — Recursive Backtracker + BFS exit placement
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const DIRS = [
    { dc:  0, dr: -1, wall: 'N', opposite: 'S' },
    { dc:  0, dr:  1, wall: 'S', opposite: 'N' },
    { dc:  1, dr:  0, wall: 'E', opposite: 'W' },
    { dc: -1, dr:  0, wall: 'W', opposite: 'E' },
];

class Maze {
    constructor(size) {
        this.size = size;
        this.grid = Array.from({ length: size }, (_, r) =>
            Array.from({ length: size }, (_, c) => new Cell(c, r))
        );
        this._generate();
        this.deadEndCount = this._tagDeadEnds();
        const exit = this._findExitCell();
        this.exitCol = exit.col;
        this.exitRow = exit.row;
    }

    cell(col, row) {
        if (col < 0 || col >= this.size || row < 0 || row >= this.size) return null;
        return this.grid[row][col];
    }

    _generate() {
        const start = this.cell(0, 0);
        start.visited = true;
        const stack = [start];
        while (stack.length > 0) {
            const cur = stack[stack.length - 1];
            const avail = DIRS
                .map(d => { const nb = this.cell(cur.col+d.dc, cur.row+d.dr); return (nb&&!nb.visited)?{nb,d}:null; })
                .filter(Boolean);
            if (avail.length === 0) { stack.pop(); }
            else {
                const { nb, d } = avail[Math.floor(Math.random()*avail.length)];
                cur.walls[d.wall] = false; nb.walls[d.opposite] = false;
                nb.visited = true; stack.push(nb);
            }
        }
    }

    _tagDeadEnds() {
        let count = 0;
        for (const row of this.grid)
            for (const cell of row)
                if (cell.openPassages === 1) { cell.isDeadEnd = true; count++; }
        return count;
    }

    _findExitCell() {
        const dist = new Map(); dist.set('0,0', 0);
        const queue = [this.cell(0, 0)];
        while (queue.length > 0) {
            const cur = queue.shift();
            const d = dist.get(`${cur.col},${cur.row}`);
            for (const dir of DIRS) {
                if (cur.walls[dir.wall]) continue;
                const nc = cur.col+dir.dc, nr = cur.row+dir.dr;
                const nk = `${nc},${nr}`;
                if (!dist.has(nk)) { dist.set(nk, d+1); queue.push(this.cell(nc, nr)); }
            }
        }
        let best = null, bestDist = -1;
        for (const row of this.grid)
            for (const cell of row)
                if (cell.isDeadEnd && !(cell.col===0&&cell.row===0)) {
                    const d = dist.get(`${cell.col},${cell.row}`) || 0;
                    if (d > bestDist) { bestDist = d; best = cell; }
                }
        return best || this.cell(this.size-1, this.size-1);
    }
}

const canvas = document.getElementById('gameCanvas');

const CC     = GAME_CONFIG.combat;
const CK     = GAME_CONFIG.chests;
const SC     = GAME_CONFIG.scaling;
const PAD    = GAME_CONFIG.padding;

let GS = GAME_CONFIG.gridSize;
let CS = GAME_CONFIG.cellSize;

canvas.width  = GS * CS + PAD * 2;
canvas.height = GS * CS + PAD * 2;

function cellOrigin(col, row) { return { x: PAD + col*CS, y: PAD + row*CS }; }

function computeLevelParams(level) {
    const gridSize    = Math.min(SC.maxGridSize, SC.baseGridSize + SC.gridGrowBy * Math.floor((level-1)/SC.gridGrowEveryN));
    const cellSize    = Math.floor(600 / gridSize);
    const zombieHp    = CC.zombieMaxHp  + SC.zombieHpPerLevel  * (level-1);
    const zombieDmg   = CC.zombieDamage + SC.zombieDmgPerLevel * (level-1);
    const extraGuards = Math.floor(level / SC.guardEveryN);
    return { gridSize, cellSize, zombieHp, zombieDmg, extraGuards };
}

const run = (() => {
    const p = computeLevelParams(1);
    return { level:1, zombieHp:p.zombieHp, zombieDmg:p.zombieDmg, extraGuards:p.extraGuards };
})();

const nextLevel = { level:0, gridSize:0, cellSize:0, zombieHp:0, zombieDmg:0, extraGuards:0 };

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  WEB AUDIO
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let audioCtx = null;
function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function playThud() {
    try {
        const ac = getAudio(); const o = ac.createOscillator(); const g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.frequency.setValueAtTime(200, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(55, ac.currentTime + 0.18);
        g.gain.setValueAtTime(0.35, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.22);
        o.start(ac.currentTime); o.stop(ac.currentTime + 0.22);
    } catch(e) {}
}

function playCrunch() {
    try {
        const ac = getAudio();
        const len = Math.floor(ac.sampleRate * 0.14);
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random()*2-1) * (1-i/len);
        const src = ac.createBufferSource(); src.buffer = buf;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.5, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.14);
        src.connect(g); g.connect(ac.destination); src.start();
    } catch(e) {}
}

function playChime() {
    try {
        const ac = getAudio();
        [523, 659, 784].forEach((freq, i) => {
            const o = ac.createOscillator(); const g = ac.createGain();
            o.connect(g); g.connect(ac.destination); o.type = 'sine'; o.frequency.value = freq;
            const t = ac.currentTime + i * 0.09;
            g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.28, t+0.02);
            g.gain.exponentialRampToValueAtTime(0.001, t+0.4);
            o.start(t); o.stop(t+0.4);
        });
    } catch(e) {}
}

function playDrone() {
    try {
        const ac = getAudio();
        const o = ac.createOscillator(); const g = ac.createGain();
        o.connect(g); g.connect(ac.destination); o.type = 'sawtooth';
        o.frequency.setValueAtTime(55, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(38, ac.currentTime + 1.8);
        g.gain.setValueAtTime(0, ac.currentTime);
        g.gain.linearRampToValueAtTime(0.13, ac.currentTime + 0.4);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 2.2);
        o.start(ac.currentTime); o.stop(ac.currentTime + 2.2);
    } catch(e) {}
}

function playCorrect() {
    try {
        const ac = getAudio(); const o = ac.createOscillator(); const g = ac.createGain();
        o.connect(g); g.connect(ac.destination); o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.28, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.22);
        o.start(ac.currentTime); o.stop(ac.currentTime + 0.22);
    } catch(e) {}
}

function playWrong() {
    try {
        const ac = getAudio(); const o = ac.createOscillator(); const g = ac.createGain();
        o.connect(g); g.connect(ac.destination); o.type = 'sawtooth';
        o.frequency.setValueAtTime(150, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(80, ac.currentTime + 0.18);
        g.gain.setValueAtTime(0.28, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.22);
        o.start(ac.currentTime); o.stop(ac.currentTime + 0.22);
    } catch(e) {}
}

function playFanfare() {
    try {
        const ac = getAudio();
        [523, 659, 784, 1047].forEach((freq, i) => {
            const o = ac.createOscillator(); const g = ac.createGain();
            o.connect(g); g.connect(ac.destination); o.type = 'sine'; o.frequency.value = freq;
            const t = ac.currentTime + i * 0.13;
            g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.26, t+0.03);
            g.gain.exponentialRampToValueAtTime(0.001, t+0.42);
            o.start(t); o.stop(t+0.5);
        });
    } catch(e) {}
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  SPARKLES
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let sparkles = [];

function spawnSparkles(col, row, now) {
    const { x, y } = cellOrigin(col, row);
    const cx = x + CS/2, cy = y + CS/2;
    for (let i = 0; i < 14; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 0.6 + Math.random() * 1.4;
        sparkles.push({
            x: cx, y: cy,
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 0.8,
            born: now,
            life: 700 + Math.random() * 500,
            size: 1.5 + Math.random() * 2,
            color: Math.random() > 0.5 ? '#ffcc22' : '#ffeeaa',
        });
    }
}

function drawSparkles(now) {
    sparkles = sparkles.filter(s => now - s.born < s.life);
    ctx.save();
    ctx.shadowBlur = 0;
    for (const s of sparkles) {
        const t = (now - s.born) / s.life;
        const alpha = (1 - t) * 0.9;
        const elapsed = now - s.born;
        const x = s.x + s.vx * elapsed * 0.05;
        const y = s.y + s.vy * elapsed * 0.05 + 0.001 * elapsed * elapsed * 0.05;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 5;
        ctx.fillRect(x - s.size/2, y - s.size/2, s.size, s.size);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;
    ctx.restore();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  PLAYER MOVEMENT TWEEN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const playerAnim = { fromCol:0, fromRow:0, toCol:0, toRow:0, startTime:0, duration:110 };

function getPlayerVisualPos(now) {
    const elapsed = now - playerAnim.startTime;
    const t = Math.min(1, elapsed / playerAnim.duration);
    const ease = t * t * (3 - 2*t);
    return {
        col: playerAnim.fromCol + (playerAnim.toCol - playerAnim.fromCol) * ease,
        row: playerAnim.fromRow + (playerAnim.toRow - playerAnim.fromRow) * ease,
    };
}

// ── Playable characters (sprites live in Characters/<folder>/<direction>.png) ──
const CHARACTERS = [
    { id:'lizard',   name:'Sir Lizard',    desc:'Top hat and cane',   color:'#66dd66' },
    { id:'princess', name:'Princess',      desc:'Pretty in pink',     color:'#ff88cc' },
    { id:'sweep',    name:'Chimney Sweep', desc:'Scrappy and brave',  color:'#ccaa66' },
    { id:'wizard',   name:'Wizard',        desc:'Wand at the ready',  color:'#8899ff' },
];
const SPRITE_DIRS = ['north','south','east','west'];
const characterSprites = {};
for (const ch of CHARACTERS) {
    characterSprites[ch.id] = {};
    for (const dir of SPRITE_DIRS) {
        const img = new Image();
        img.src = `Characters/${ch.id}/${dir}.png`;
        characterSprites[ch.id][dir] = img;
    }
}

function getCharacterIdx(id) {
    const i = CHARACTERS.findIndex(c => c.id === id);
    return i >= 0 ? i : 0;
}

// Draws a character sprite centred on (cx, cy) at `size` px. Falls back to the
// old red block if the image hasn't loaded (e.g. Characters folder missing).
function drawCharacterSprite(charId, facing, cx, cy, size, flashAlpha) {
    const img = (characterSprites[charId] || characterSprites.lizard)[facing] ||
                (characterSprites[charId] || characterSprites.lizard).south;
    ctx.save();
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, Math.round(cx - size/2), Math.round(cy - size/2), Math.round(size), Math.round(size));
        if (flashAlpha > 0) {
            // Tint only the sprite's pixels red when hit
            ctx.globalCompositeOperation = 'source-atop';
            ctx.fillStyle = `rgba(255,30,0,${flashAlpha})`;
            ctx.fillRect(cx - size/2, cy - size/2, size, size);
        }
    } else {
        const s = size * 0.35;
        ctx.fillStyle = C.player; ctx.fillRect(cx-s, cy-s, s*2, s*2);
        if (flashAlpha > 0) { ctx.fillStyle = `rgba(255,30,0,${flashAlpha})`; ctx.fillRect(cx-s, cy-s, s*2, s*2); }
    }
    ctx.restore();
}

function drawPlayerAvatar(cx, cy, scale, flashAlpha) {

function drawExitDoor(cx, cy, scale, unlocked, now) {
    ctx.save(); ctx.translate(cx, cy); ctx.scale(scale, scale);
    ctx.shadowBlur = 0;
    // Frame + arch
    ctx.fillStyle = '#3a2410'; ctx.fillRect(-13,-14,26,30);
    ctx.fillStyle = unlocked ? '#1a0a1a' : '#6b3f1a';
    ctx.fillRect(-10,-11,20,27);
    if (unlocked) {
        // Open door swung to the side, glowing doorway
        const glow = 0.45 + 0.25*Math.sin(now*0.005);
        ctx.fillStyle = `rgba(255,102,238,${glow})`; ctx.fillRect(-10,-11,20,27);
        ctx.fillStyle = '#6b3f1a'; ctx.fillRect(-10,-11,5,27);
    } else {
        // Planks + padlock
        ctx.fillStyle = '#4a2a10'; ctx.fillRect(-4,-11,1,27); ctx.fillRect(3,-11,1,27);
        ctx.fillStyle = '#999999'; ctx.fillRect(-4,-1,8,2);
        ctx.strokeStyle = '#dddddd'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 2, 3, Math.PI, 0); ctx.stroke();
        ctx.fillStyle = '#ffcc22'; ctx.fillRect(-4,2,8,7);
        ctx.fillStyle = '#1a0800'; ctx.fillRect(-1,4,2,3);
    }
    ctx.restore();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  HP BAR + FLASH
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function drawHpBar(x, y, w, h, current, max, isPlayer) {
    const ratio = Math.max(0, current/max);
    const fill  = isPlayer ? (ratio>0.5?C.hpBarPlayer:ratio>0.25?C.hpBarWarn:C.hpBarDanger) : C.hpBarZombie;
    ctx.shadowBlur = 0;
    ctx.fillStyle  = C.hpBarBg; ctx.fillRect(x, y, w, h);
    ctx.fillStyle  = fill; ctx.fillRect(x+1, y+1, Math.max(0,Math.floor((w-2)*ratio)), h-2);
    ctx.font = `${Math.floor(h*1.05)}px VT323, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ccffcc';
    ctx.fillText(`${current} / ${max}`, x+w/2, y+h/2+1);
}

function hitFlashAlpha(flashAt, now) {
    const e = now - flashAt;
    if (e >= CC.flashDurationMs) return 0;
    return (1 - e/CC.flashDurationMs) * 0.85;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  LOOT POPUP TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const popup = { _timer: null };

function showPopup(title, subtitle, color) {
    const el = document.getElementById('loot-popup');
    const titleEl = document.getElementById('loot-title');
    const subEl   = document.getElementById('loot-sub');
    titleEl.textContent = title;
    titleEl.style.color = color;
    subEl.textContent   = subtitle;
    el.style.borderColor  = color;
    el.style.boxShadow    = `0 0 14px ${color}66`;
    el.classList.add('visible');
    clearTimeout(popup._timer);
    popup._timer = setTimeout(() => el.classList.remove('visible'), CK.popupDurationMs);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  PANEL BORDER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function drawPanelBorder(PX, PY, PW, PH, borderColor, glowColor) {
    const bc = borderColor || C.combatBorder;
    const gc = glowColor   || C.combatBorderGlow;
    const ck = 16;
    ctx.strokeStyle = bc; ctx.lineWidth = 2;
    ctx.shadowColor = gc; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(PX+ck,PY);       ctx.lineTo(PX,PY);       ctx.lineTo(PX,PY+ck);
    ctx.moveTo(PX+PW-ck,PY);    ctx.lineTo(PX+PW,PY);    ctx.lineTo(PX+PW,PY+ck);
    ctx.moveTo(PX,PY+PH-ck);    ctx.lineTo(PX,PY+PH);    ctx.lineTo(PX+ck,PY+PH);
    ctx.moveTo(PX+PW,PY+PH-ck); ctx.lineTo(PX+PW,PY+PH); ctx.lineTo(PX+PW-ck,PY+PH);
    ctx.stroke();
    ctx.lineWidth = 1; ctx.setLineDash([4,7]);
    ctx.beginPath();
    ctx.moveTo(PX+ck+4,PY);    ctx.lineTo(PX+PW-ck-4,PY);
    ctx.moveTo(PX+ck+4,PY+PH); ctx.lineTo(PX+PW-ck-4,PY+PH);
    ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur = 0;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  MAZE RENDER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderMaze(maze, player, zombies, chests, now) {
    ctx.fillStyle = C.background;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const isExit = (c,r) => c === maze.exitCol && r === maze.exitRow;

    ctx.shadowBlur = 0;
    for (const row of maze.grid) {
        for (const cell of row) {
            const { x, y } = cellOrigin(cell.col, cell.row);
            const isSt = cell.col===0 && cell.row===0;
            const isEx = isExit(cell.col, cell.row);
            if      (isSt)           ctx.fillStyle = C.cellStart;
            else if (isEx)           ctx.fillStyle = C.cellExit;
            else if (cell.isDeadEnd) ctx.fillStyle = C.cellDeadEnd;
            else                     ctx.fillStyle = C.cellDefault;
            ctx.fillRect(x, y, CS, CS);
        }
    }

    ctx.lineWidth = C.wallWidth; ctx.strokeStyle = C.wall;
    ctx.shadowColor = C.wallGlow; ctx.shadowBlur = C.wallGlowBlur;
    ctx.lineCap = 'square';
    for (const row of maze.grid) {
        for (const cell of row) {
            const { x, y } = cellOrigin(cell.col, cell.row);
            ctx.beginPath();
            if (cell.walls.N) { ctx.moveTo(x,y);    ctx.lineTo(x+CS,y);    }
            if (cell.walls.S) { ctx.moveTo(x,y+CS);  ctx.lineTo(x+CS,y+CS); }
            if (cell.walls.E) { ctx.moveTo(x+CS,y);  ctx.lineTo(x+CS,y+CS); }
            if (cell.walls.W) { ctx.moveTo(x,y);     ctx.lineTo(x,y+CS);    }
            ctx.stroke();
        }
    }

    ctx.shadowBlur = 10;
    const lfs = Math.max(9, Math.floor(CS*0.21));
    ctx.font = `${lfs}px VT323, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    { const { x, y } = cellOrigin(0, 0);
      ctx.fillStyle = C.labelStart; ctx.shadowColor = C.labelStart;
      ctx.fillText('START', x+CS/2, y+CS*0.78); }
    { const { x, y } = cellOrigin(maze.exitCol, maze.exitRow);
      drawExitDoor(x+CS/2, y+CS*0.4, CS/60, player.hasKey, now);
      ctx.font = `${lfs}px VT323, monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = player.hasKey ? C.labelExit : '#ff4444';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
      ctx.fillText(player.hasKey ? 'EXIT' : 'LOCKED', x+CS/2, y+CS*0.84); }

    const spriteScale = CS/60;
    ctx.shadowColor = C.chestGlow; ctx.shadowBlur = C.chestGlowBlur;
    for (const [, chest] of chests) {
        const { x, y } = cellOrigin(chest.col, chest.row);
        drawChestSprite(x+CS/2, y+CS/2, spriteScale);
    }

    ctx.shadowColor = C.zombieGlow; ctx.shadowBlur = C.zombieGlowBlur;
    for (const [, z] of zombies) {
        const { x, y } = cellOrigin(z.col, z.row);
        drawZombieSprite(x+CS/2, y+CS/2+2*spriteScale, spriteScale, 0);
        ctx.shadowBlur = 0;
        const bW=CS-12, bX=x+6, bY=y+3;
        ctx.fillStyle = C.countdownBarBg; ctx.fillRect(bX, bY, bW, 4);
        ctx.fillStyle = z.hp/z.maxHp > 0.5 ? '#773300' : '#cc1100';
        ctx.fillRect(bX, bY, Math.max(0,Math.floor(bW*(z.hp/z.maxHp))), 4);
        ctx.shadowColor = C.zombieGlow; ctx.shadowBlur = C.zombieGlowBlur;
    }

    ctx.shadowBlur = 0;
    const vp = getPlayerVisualPos(now);
    const vpx = PAD + vp.col*CS, vpy = PAD + vp.row*CS;
    drawCharacterSprite(gameConfig.character, player.facing, vpx+CS/2, vpy+CS/2, CS*1.15, 0);

    renderFog(vp);
    drawSparkles(now);
    drawLevelUpNotif(now);
    drawExterminatorNotif(now);
    ctx.shadowBlur = 0;
}

function drawHpCorner(player) {
    const bW=86, bH=9, edge=PAD+4;
    const bX=canvas.width-edge-bW, bY=edge+1;
    const ratio = player.hp/player.maxHp;
    const fill  = ratio>0.5?C.hpBarPlayer:ratio>0.25?C.hpBarWarn:C.hpBarDanger;
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(bX-22, bY-2, bW+24, bH+16);
    ctx.font = '13px VT323, monospace'; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#2a5a2a'; ctx.fillText('HP', bX-3, bY);
    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(bX, bY, bW, bH);
    ctx.fillStyle = fill; ctx.fillRect(bX+1, bY+1, Math.max(0,Math.floor((bW-2)*ratio)), bH-2);
    ctx.font = '12px VT323, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = fill; ctx.fillText(`${player.hp} / ${player.maxHp}`, bX+bW/2, bY+bH+2);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  FOG OF WAR
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function getVisionRadius() {
    const torchBonus = [0, 0.5, 1.5, 3.0][player.torchTier] || 0;
    return Math.min(5.0, 1.0 + mazeZombiesKilledCount * 0.33 + torchBonus);
}

function updateFogVisited() {
    if (!currentMaze) return;
    const vr = getVisionRadius();
    const range = Math.ceil(vr) + 1;
    for (let dc = -range; dc <= range; dc++) {
        for (let dr = -range; dr <= range; dr++) {
            if (Math.sqrt(dc*dc + dr*dr) <= vr + 0.5) {
                const nc = player.col + dc, nr = player.row + dr;
                if (nc >= 0 && nc < currentMaze.size && nr >= 0 && nr < currentMaze.size)
                    fogVisited.add(`${nc},${nr}`);
            }
        }
    }
}

function ensureFogCanvas() {
    if (!fogCanvas || fogCanvas.width !== canvas.width || fogCanvas.height !== canvas.height) {
        fogCanvas = document.createElement('canvas');
        fogCanvas.width  = canvas.width;
        fogCanvas.height = canvas.height;
        fogCtx = fogCanvas.getContext('2d');
    }
}

function renderFog(vp) {
    ensureFogCanvas();
    fogCtx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);

    for (const row of currentMaze.grid) {
        for (const cell of row) {
            const { x, y } = cellOrigin(cell.col, cell.row);
            fogCtx.fillStyle = fogVisited.has(`${cell.col},${cell.row}`)
                ? 'rgba(0,0,0,0.75)'
                : 'rgba(0,0,0,0.97)';
            fogCtx.fillRect(x, y, CS, CS);
        }
    }

    const vr    = getVisionRadius();
    const px    = PAD + (vp.col + 0.5) * CS;
    const py    = PAD + (vp.row + 0.5) * CS;
    const innerR = vr * CS;
    const outerR = (vr + 0.5) * CS;
    fogCtx.globalCompositeOperation = 'destination-out';
    const grad = fogCtx.createRadialGradient(px, py, innerR, px, py, outerR);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    fogCtx.fillStyle = grad;
    fogCtx.fillRect(0, 0, fogCanvas.width, fogCanvas.height);
    fogCtx.globalCompositeOperation = 'source-over';

    ctx.drawImage(fogCanvas, 0, 0);
}

function drawSaveFlash(now) {
    const elapsed = now - saveFlash.shownAt;
    if (elapsed >= saveFlash.duration) return;
    const alpha = elapsed < 1400 ? 0.9 : 0.9 * (1 - (elapsed - 1400) / 400);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = '15px VT323, monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = '#88ffaa'; ctx.shadowColor = '#00ff41'; ctx.shadowBlur = 8;
    ctx.fillText('SAVED', canvas.width - 6, canvas.height - 6);
    ctx.shadowBlur = 0;
    ctx.restore();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  COMBAT OVERLAY — multi-mode dispatcher
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderCombat(player, combat, now) {
    const PW=494, PH=470;
    const PX=Math.floor((canvas.width-PW)/2);
    const PY=Math.floor((canvas.height-PH)/2);

    ctx.fillStyle = C.combatOverlay; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.shadowBlur = 0;
    ctx.fillStyle  = C.combatPanel; ctx.fillRect(PX, PY, PW, PH);

    const tc = TIER_CONFIG[gameConfig.playerTier];
    drawPanelBorder(PX, PY, PW, PH, tc.color, tc.glow);

    ctx.font = '30px VT323, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = tc.color; ctx.shadowColor = tc.glow; ctx.shadowBlur = 12;
    ctx.fillText('☠  COMBAT  ☠', PX+PW/2, PY+26); ctx.shadowBlur = 0;

    ctx.strokeStyle='#0a1a0a'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX+18,PY+46); ctx.lineTo(PX+PW-18,PY+46); ctx.stroke();

    const avatarY=PY+118, pAvatX=PX+110, zAvatX=PX+PW-110, aScale=1.85;
    const pFlash=hitFlashAlpha(combat.playerFlashAt,now);
    const zFlash=hitFlashAlpha(combat.zombieFlashAt,now);

    ctx.shadowColor=C.playerGlow; ctx.shadowBlur=18;
    drawPlayerAvatar(pAvatX, avatarY, aScale, pFlash); ctx.shadowBlur=0;
    ctx.font='26px VT323, monospace'; ctx.fillStyle='#1a341a';
    ctx.fillText('VS', PX+PW/2, avatarY);
    ctx.shadowColor=C.zombieGlow; ctx.shadowBlur=C.zombieGlowBlur;
    drawZombieSprite(zAvatX, avatarY, aScale, zFlash); ctx.shadowBlur=0;

    const barW=160, barH=20, barY=PY+182;
    drawHpBar(pAvatX-barW/2, barY, barW, barH, player.hp,        player.maxHp,        true);
    drawHpBar(zAvatX-barW/2, barY, barW, barH, combat.zombie.hp, combat.zombie.maxHp, false);

    const nameY=barY+barH+12;
    const effDmg=Math.max(1,run.zombieDmg-player.armorLevel);
    const dmgLabel=player.armorLevel>0?`${run.zombieDmg} DMG  (-${player.armorLevel} ARM)`:`${run.zombieDmg} DMG`;
    ctx.font='18px VT323, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#aaddaa'; ctx.fillText('PLAYER', pAvatX, nameY);
    ctx.fillStyle='#558844'; ctx.fillText(player.weapon.name.toUpperCase(), pAvatX, nameY+19);
    ctx.fillStyle='#cc7744'; ctx.fillText('ZOMBIE', zAvatX, nameY);
    ctx.fillStyle=effDmg<run.zombieDmg?'#557766':'#664433';
    ctx.fillText(dmgLabel, zAvatX, nameY+19);

    const cdW=258, cdH=8;
    const cdX=PX+Math.floor((PW-cdW)/2);
    const cdY=nameY+38;
    const attackMs = TIER_CONFIG[gameConfig.playerTier].attackMs;
    const cdRatio=Math.min(1,Math.max(0,(combat.zombieNextAt-now)/attackMs));
    ctx.font='13px VT323, monospace'; ctx.fillStyle='#4a1800'; ctx.textAlign='center';
    ctx.fillText('▼  ZOMBIE ATTACKS  ▼', PX+PW/2, cdY-8);
    ctx.fillStyle=C.countdownBarBg; ctx.fillRect(cdX, cdY, cdW, cdH);
    ctx.fillStyle=C.countdownBar; ctx.fillRect(cdX+1, cdY+1, Math.floor((cdW-2)*cdRatio), cdH-2);

    // Stagger flash
    const staggerElapsed = now - staggerFlash.shownAt;
    if (staggerElapsed < staggerFlash.duration) {
        const sa = staggerElapsed < 300 ? 1 : 1-(staggerElapsed-300)/500;
        ctx.save(); ctx.globalAlpha = Math.max(0, sa);
        ctx.font='20px VT323, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#00ffcc'; ctx.shadowColor='#00ffcc'; ctx.shadowBlur=14;
        ctx.fillText('STAGGERED!', PX+PW/2, cdY-28); ctx.shadowBlur=0;
        ctx.restore();
    }

    const challengeY = cdY + cdH + 12;

    const mode = gameConfig.learningMode;
    if (mode === 'TYPING')  renderTypingChallenge(combat, now, PX, PW, challengeY);
    else if (mode === 'MATH')    renderMathChallenge(combat, now, PX, PW, challengeY);
    else if (mode === 'COLOR')   renderColorChallenge(combat, now, PX, PW, challengeY, PY, PH);

    // Chicken button
    combat.chickenRect = null;
    if (player.chickens > 0) {
        const bW=200, bH=26, bX=PX+PW-bW-10, bY=PY+PH-bH-10;
        ctx.fillStyle='rgba(30,20,0,0.9)'; ctx.fillRect(bX, bY, bW, bH);
        ctx.strokeStyle='#ffcc44'; ctx.lineWidth=1;
        ctx.strokeRect(bX+0.5, bY+0.5, bW-1, bH-1);
        ctx.font='13px VT323, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#ffcc44';
        ctx.fillText(`🐔 Use Chicken (${player.chickens})`, bX+bW/2, bY+bH/2);
        combat.chickenRect = { x:bX, y:bY, w:bW, h:bH };
    }
}

function renderTypingChallenge(combat, now, PX, PW, startY) {
    const tier = gameConfig.playerTier;
    const fontSize = TIER_CONFIG[tier].fontSize;
    const wordY = startY + 28;
    const word   = combat.word  || '';
    const typed  = combat.typed || '';
    const wrongFlash = hitFlashAlpha(combat.wrongFlashAt, now);

    ctx.font = `${fontSize}px VT323, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    if (wrongFlash > 0) {
        ctx.fillStyle = `rgba(255,60,60,${Math.min(1,wrongFlash)})`;
        ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 14;
        ctx.fillText(word, PX+PW/2, wordY);
        ctx.shadowBlur = 0;
    } else {
        const totalW = ctx.measureText(word).width;
        const startX = PX+PW/2 - totalW/2;
        const charW  = word.length > 0 ? totalW / word.length : 0;
        for (let i = 0; i < word.length; i++) {
            const cx = startX + (i + 0.5) * charW;
            if (i < typed.length) {
                ctx.fillStyle='#00ee77'; ctx.shadowColor='#00ff88'; ctx.shadowBlur=8;
            } else if (i === typed.length) {
                const pulse2 = 0.75+0.25*Math.sin(now*0.008);
                ctx.fillStyle=`rgba(255,255,255,${pulse2})`; ctx.shadowColor='#aaffaa'; ctx.shadowBlur=6;
            } else {
                ctx.fillStyle='#2a3a2a'; ctx.shadowBlur=0;
            }
            ctx.fillText(word[i], cx, wordY);
        }
        ctx.shadowBlur=0;
    }

    const inputY = wordY + Math.ceil(fontSize / 2) + 72;
    ctx.font='22px VT323, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#1a2a1a';
    ctx.fillRect(PX+PW/2-120, inputY-12, 240, 24);
    ctx.strokeStyle='#1f3a1f'; ctx.lineWidth=1;
    ctx.strokeRect(PX+PW/2-120, inputY-12, 240, 24);
    if (typed.length > 0) {
        ctx.fillStyle = wrongFlash>0 ? `rgba(255,80,80,${wrongFlash})` : '#00cc55';
        ctx.fillText(typed + (Math.floor(now/280)%2===0?'_':''), PX+PW/2, inputY);
    } else {
        ctx.fillStyle='#2a402a';
        ctx.fillText(Math.floor(now/280)%2===0?'_':'', PX+PW/2, inputY);
    }

    const logY = inputY + 28;
    ctx.font='17px VT323, monospace'; ctx.fillStyle='#55bb55';
    ctx.shadowColor='#00aa33'; ctx.shadowBlur=4;
    ctx.fillText(combat.log, PX+PW/2, logY); ctx.shadowBlur=0;
}

function renderMathChallenge(combat, now, PX, PW, startY) {
    const wrongFlash = hitFlashAlpha(combat.mathWrongAt, now);
    const cx = PX + PW/2;

    ctx.font='46px VT323, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    if (wrongFlash > 0) {
        ctx.fillStyle=`rgba(255,60,60,${wrongFlash})`; ctx.shadowColor='#ff0000'; ctx.shadowBlur=14;
    } else {
        ctx.fillStyle='#ccffcc'; ctx.shadowColor='#00ff88'; ctx.shadowBlur=8;
    }
    ctx.fillText(combat.mathProblem, cx, startY+28); ctx.shadowBlur=0;

    const inputY = startY + 68;
    ctx.fillStyle='#1a2a1a';
    ctx.fillRect(cx-80, inputY-14, 160, 28);
    ctx.strokeStyle='#1f3a1f'; ctx.lineWidth=1;
    ctx.strokeRect(cx-80, inputY-14, 160, 28);
    ctx.font='24px VT323, monospace'; ctx.textBaseline='middle';
    const disp = combat.mathTyped + (Math.floor(now/280)%2===0?'_':'');
    ctx.fillStyle = wrongFlash>0 ? `rgba(255,80,80,${wrongFlash})` : '#00cc55';
    ctx.fillText(disp.length > 0 ? disp : (Math.floor(now/280)%2===0?'_':''), cx, inputY);

    ctx.font='14px VT323, monospace'; ctx.fillStyle='#446644';
    ctx.fillText('TYPE ANSWER  +  ENTER', cx, inputY+28);
    ctx.font='17px VT323, monospace'; ctx.fillStyle='#55bb55';
    ctx.fillText(combat.log, cx, inputY+50);
}

function renderColorChallenge(combat, now, PX, PW, startY, PY, PH) {
    if (!combat.colorChallenge) return;
    const ch = combat.colorChallenge;
    const cx = PX + PW/2;
    const wrongFlash = hitFlashAlpha(combat.colorWrongAt, now);

    // Draw swatch or Stroop word
    if (ch.type === 'SWATCH') {
        const sw = 60, sh = 36;
        ctx.fillStyle = ch.swatchColor;
        ctx.shadowColor = ch.swatchColor; ctx.shadowBlur = wrongFlash>0 ? 0 : 12;
        ctx.fillRect(cx-sw/2, startY+4, sw, sh); ctx.shadowBlur=0;
        ctx.font='14px VT323, monospace'; ctx.fillStyle='#446644';
        ctx.fillText('CLICK THE NAME OF THIS COLOR', cx, startY+sh+20);
    } else {
        // Stroop / shape
        const prompt = ch.prompt || 'CLICK THE INK COLOR';
        const displayWord = ch.displayWord || '';
        const inkCss = ch.inkCss || '#ffffff';
        ctx.font='44px VT323, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        if (wrongFlash > 0) {
            ctx.fillStyle=`rgba(255,60,60,${wrongFlash})`; ctx.shadowBlur=0;
        } else {
            ctx.fillStyle = inkCss; ctx.shadowColor = inkCss; ctx.shadowBlur=10;
        }
        ctx.fillText(displayWord, cx, startY+26); ctx.shadowBlur=0;
        ctx.font='14px VT323, monospace'; ctx.fillStyle='#446644';
        ctx.fillText(prompt, cx, startY+52);
    }

    // Buttons
    const opts = ch.options;
    const numOpts = opts.length;
    const btnW = Math.floor((PW - 40) / numOpts) - 6;
    const btnH = 34;
    const btnRowY = startY + 66;
    const totalBtnW = numOpts*(btnW+6) - 6;
    const btnStartX = PX + Math.floor((PW-totalBtnW)/2);

    combat.colorButtons = [];
    for (let i=0; i<numOpts; i++) {
        const bx = btnStartX + i*(btnW+6);
        const isCorrect = opts[i].correct;
        const cssColor = COLOR_DATA[opts[i].word] || '#888888';
        ctx.fillStyle = wrongFlash>0 && isCorrect ? `rgba(255,60,60,0.3)` : 'rgba(0,20,0,0.85)';
        ctx.fillRect(bx, btnRowY, btnW, btnH);
        ctx.strokeStyle = cssColor; ctx.lineWidth = 2;
        ctx.shadowColor = cssColor; ctx.shadowBlur = 6;
        ctx.strokeRect(bx+1, btnRowY+1, btnW-2, btnH-2); ctx.shadowBlur=0;
        // Color swatch strip
        ctx.fillStyle = cssColor;
        ctx.fillRect(bx+2, btnRowY+2, 8, btnH-4);
        ctx.font='15px VT323, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#ccffcc';
        ctx.fillText(opts[i].word, bx+btnW/2+5, btnRowY+btnH/2);
        combat.colorButtons.push({x:bx, y:btnRowY, w:btnW, h:btnH, correct:isCorrect});
    }

    ctx.font='17px VT323, monospace'; ctx.fillStyle='#55bb55'; ctx.textAlign='center';
    ctx.fillText(combat.log, PX+PW/2, btnRowY+btnH+20);
}



// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  BATTLE PREP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderBattlePrep(now) {
    const elapsed = now - battlePrep.startedAt;
    ctx.fillStyle='rgba(0,0,0,0.68)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const cx=canvas.width/2, cy=canvas.height/2;
    ctx.textAlign='center'; ctx.textBaseline='middle';

    ctx.font='22px VT323, monospace'; ctx.fillStyle='#cc4444';
    ctx.shadowColor='#ff0000'; ctx.shadowBlur=8;
    ctx.fillText('☠  ZOMBIE INCOMING  ☠', cx, cy-80); ctx.shadowBlur=0;

    const tc = TIER_CONFIG[gameConfig.playerTier];
    ctx.font='14px VT323, monospace'; ctx.fillStyle=tc.color;
    ctx.fillText(tc.name.toUpperCase() + '  |  ' + (LEARNING_MODES.find(m=>m.id===gameConfig.learningMode)||LEARNING_MODES[0]).label.toUpperCase(), cx, cy-58);

    if (elapsed < 3000) {
        const count = 3 - Math.min(2, Math.floor(elapsed / 1000));
        const phase = elapsed % 1000;
        const scale = phase < 150 ? 1+(1-phase/150)*0.5 : 1;
        const alpha = phase > 750 ? 1-(phase-750)/250 : 1;
        const cols = ['#ffdd00','#ffaa00','#ff4400'];

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-cx,-cy);
        ctx.font='110px VT323, monospace';
        const col = cols[3-count] || '#ffdd00';
        ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=40*alpha;
        ctx.fillText(String(count), cx, cy+10); ctx.shadowBlur=0;
        ctx.restore();
    } else {
        const fElapsed = elapsed - 3000;
        const falpha = fElapsed < 150 ? fElapsed/150 : Math.max(0,1-(fElapsed-150)/350);
        ctx.save(); ctx.globalAlpha=falpha;
        ctx.font='72px VT323, monospace'; ctx.fillStyle='#00ff88';
        ctx.shadowColor='#00ff88'; ctx.shadowBlur=28;
        ctx.fillText('FIGHT!', cx, cy+10); ctx.shadowBlur=0;
        ctx.restore();
    }

    // Key holder can't be skipped — otherwise the level could never be finished
    battlePrep.repellentRect = null;
    if (battlePrep.zombie && battlePrep.zombie.hasKey) {
        ctx.font='20px VT323, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#ffdd44'; ctx.shadowColor='#ffaa00'; ctx.shadowBlur=10;
        ctx.fillText('🗝️ This zombie is carrying the EXIT KEY!', cx, cy+84); ctx.shadowBlur=0;
    } else if (player.repellents > 0) {
        const bW=200, bH=28, bX=cx-100, bY=cy+70;
        ctx.fillStyle='rgba(20,40,60,0.9)'; ctx.fillRect(bX, bY, bW, bH);
        ctx.strokeStyle='#88ddff'; ctx.lineWidth=1;
        ctx.strokeRect(bX+0.5, bY+0.5, bW-1, bH-1);
        ctx.font='14px VT323, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#88ddff';
        ctx.fillText(`🧴 Use Repellent (${player.repellents})`, cx, bY+bH/2);
        battlePrep.repellentRect = { x:bX, y:bY, w:bW, h:bH };
    }
}

//  LEVEL COMPLETE  (enhanced)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderLevelComplete(now) {
    ctx.fillStyle='rgba(0,0,0,0.86)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const cx=canvas.width/2, cy=canvas.height/2;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='62px VT323, monospace'; ctx.fillStyle=C.levelComplete;

    }

    const extraOff = levelCompleteData.allZombiesKilled ? 18 : 0;
    if (levelCompleteData.allZombiesKilled) {

    );
    const pulse=0.6+0.4*Math.sin(now*0.003);

    ctx.strokeStyle=`rgba(0,255,65,${pulse})`; ctx.lineWidth=1;
    ctx.strokeRect(bX+0.5,bY+0.5,bW-1,bH-1);
    ctx.font='22px VT323, monospace'; ctx.fillStyle=`rgba(0,255,65,${pulse})`;
    ctx.shadowColor='#00ff41'; ctx.shadowBlur=pulse*10;
    ctx.fillText('[ ENTER ]  VISIT THE SHOP', cx, bY+bH/2); ctx.shadowBlur=0;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  UPGRADE SHOP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function getWeaponTierIndex() {
    const idx = WEAPONS.findIndex(w => w.name === player.weapon.name);
    return idx >= 0 ? idx : 0;
}
function getNextWeapon() {
    const t = getWeaponTierIndex();
    return t < WEAPONS.length - 1 ? WEAPONS[t + 1] : null;
}

function weaponTierState(i) {
    const cur = getWeaponTierIndex();
    if (i < cur)  return 'owned';
    if (i === cur) return 'current';
    if (i === cur + 1) {
        const w = WEAPONS[i];
        if (player.playerLevel < w.level) return 'locked_level';
        return player.gold >= w.cost ? 'buyable' : 'locked_cost';
    }
    return 'future';
}
function armorTierState(i) {
    if (i < player.armorTier)  return 'owned';
    if (i === player.armorTier) return 'current';
    if (i === player.armorTier + 1) {
        const a = ARMORS[i];
        if (player.playerLevel < a.level) return 'locked_level';
        return player.gold >= a.cost ? 'buyable' : 'locked_cost';
    }
    return 'future';
}

function buildShopItems() {
    const wt = getWeaponTierIndex();
    let weapItem;
    if (wt >= WEAPONS.length - 1) {
        weapItem = { idx:0, icon:'>', label:'WEAPON', name: player.weapon.name,
                     desc:`${player.weapon.damage} DMG  (tier ${wt+1}/${WEAPONS.length})`,
                     status:'maxed', cost:0, levelReq:0 };
    } else {
        const nw = WEAPONS[wt+1];
        const st = weaponTierState(wt+1);
        weapItem = { idx:0, icon:'>', label:'WEAPON', name: nw.name,
                     desc:`${nw.damage} DMG  (now: ${player.weapon.name} ${player.weapon.damage}dmg)`,
                     status: st==='locked_level'?'locked_level':st==='locked_cost'?'locked_cost':'buyable',
                     cost:nw.cost, levelReq:nw.level };
    }
    const at = player.armorTier;
    let armItem;
    if (at >= ARMORS.length - 1) {
        armItem = { idx:1, icon:'[', label:'ARMOR', name: ARMORS[at].name,
                    desc:`-${ARMORS[at].defense} DEF  (tier ${at+1}/${ARMORS.length})`,
                    status:'maxed', cost:0, levelReq:0 };
    } else {
        const na = ARMORS[at+1];
        const st = armorTierState(at+1);
        armItem = { idx:1, icon:'[', label:'ARMOR', name: na.name,
                    desc:`-${na.defense} DEF  (now: ${ARMORS[at].name} -${ARMORS[at].defense}def)`,
                    status: st==='locked_level'?'locked_level':st==='locked_cost'?'locked_cost':'buyable',
                    cost:na.cost, levelReq:na.level };
    }
    const potFull = player.potions >= 5;
    const potItem = { idx:2, icon:'+', label:'POTION', name:'Health Potion',
                      desc:`Restores 20 HP  ·  Have: ${player.potions}/5`,
                      status: potFull?'maxed':player.gold<20?'locked_cost':'buyable',
                      cost:20, levelReq:1 };
    const hpItem  = { idx:3, icon:'^', label:'MAX HP', name:'Max HP Upgrade',
                      desc:`+10 max HP  ·  Currently: ${player.maxHp} HP`,
                      status: player.gold<60?'locked_cost':'buyable',
                      cost:60, levelReq:1 };
    return [weapItem, armItem, potItem, hpItem];
}

function hasMadePurchase() {
    if (!shopUi.snapshot) return false;
    const s = shopUi.snapshot;
    return (player.gold !== s.gold || player.weapon.name !== s.weaponName ||
            player.armorTier !== s.armorTier || player.potions !== s.potions ||
            player.maxHp !== s.maxHp || player.chickens !== s.chickens ||
            player.repellents !== s.repellents || player.rabbitFeet !== s.rabbitFeet ||
            player.torchTier !== s.torchTier);
}

function shopNavNext(cur) {
    const items = buildShopItems();
    let n = (cur+1)%4, tries=0;
    while (items[n].status==='locked_level' && tries<4) { n=(n+1)%4; tries++; }
    return n;
}
function shopNavPrev(cur) {
    const items = buildShopItems();
    let n = (cur+3)%4, tries=0;
    while (items[n].status==='locked_level' && tries<4) { n=(n+3)%4; tries++; }
    return n;
}

function applyOopsReset() {
    if (!shopUi.snapshot) return;
    const s = shopUi.snapshot;
    shopUi.goldFlashFrom = player.gold;
    player.gold = s.gold;
    player.weapon.name = s.weaponName; player.weapon.damage = s.weaponDamage;
    player.armorTier = s.armorTier; player.armorLevel = s.armorLevel;
    player.potions = s.potions; player.maxHp = s.maxHp; player.hp = s.hp;
    player.playerLevel = s.playerLevel; player.xp = s.xp;
    player.chickens = s.chickens; player.repellents = s.repellents;
    player.rabbitFeet = s.rabbitFeet; player.torchTier = s.torchTier;
    shopUi.goldFlashAt = performance.now();
    shopUi.oopsFlashAt = performance.now();
    shopUi.oopsConfirm = false;
    syncHpHud(); syncGoldHud(); syncPotionsHud(); syncPlayerLevelHud(); syncXpHud();
    syncWeaponHud(); syncArmorHud();
    saveGame();
}

// Shop palette: plain black background, high-contrast text so prices are easy to read
const SHOP = {
    bg:        '#000000',
    card:      '#0e0e0e',
    cardHi:    '#1c1c1c',
    line:      '#444444',
    text:      '#ffffff',
    subtext:   '#cccccc',
    dim:       '#999999',
    gold:      '#ffdd44',
    good:      '#44ff88',
    bad:       '#ff6666',
};

// Draws text, shrinking the font until it fits within maxW
function fillFit(text, x, y, maxW, size, minSize) {
    let s = size;
    ctx.font = `${s}px VT323, monospace`;
    while (s > (minSize || 12) && ctx.measureText(text).width > maxW) {
        s--; ctx.font = `${s}px VT323, monospace`;
    }
    ctx.fillText(text, x, y);
}

function drawQuadCard(cx, cy, cw, ch, item, highlighted, now) {
    if (!item) return;
    const status = item.status;
    const isLocked  = status === 'locked_level';
    const isBroke   = status === 'locked_cost';
    const isMaxed   = status === 'maxed';
    const isOwned   = status === 'owned';
    const isBuyable = status === 'buyable';
    const midX = cx + cw/2;
    const maxW = cw - 16;

    // Card background + border
    ctx.shadowBlur = 0;
    ctx.fillStyle = highlighted ? SHOP.cardHi : SHOP.card;
    ctx.fillRect(cx, cy, cw, ch);
    if (highlighted) {
        ctx.strokeStyle = isBuyable ? SHOP.gold : SHOP.text; ctx.lineWidth = 2;
        ctx.strokeRect(cx+1, cy+1, cw-2, ch-2);
    } else {
        ctx.strokeStyle = isBuyable ? '#8a7520' : SHOP.line; ctx.lineWidth = 1;
        ctx.strokeRect(cx+0.5, cy+0.5, cw-1, ch-1);
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    // Icon
    ctx.globalAlpha = isLocked ? 0.45 : 1;
    ctx.font = '34px VT323, monospace';
    ctx.fillStyle = SHOP.text;
    ctx.fillText(item.icon, midX, cy + 28);
    ctx.globalAlpha = 1;

    // Name
    ctx.fillStyle = isLocked ? SHOP.dim : SHOP.text;
    fillFit(item.name, midX, cy + 58, maxW, 24, 16);

    // What it does
    ctx.fillStyle = isLocked ? SHOP.dim : (item.statColor || SHOP.good);
    fillFit(item.statLine, midX, cy + 82, maxW, 18, 13);

    // How many you have
    if (item.countLine) {
        ctx.fillStyle = SHOP.subtext;
        fillFit(item.countLine, midX, cy + 102, maxW, 17, 13);
    }

    // Price — the big one
    const priceY = cy + ch - 46;
    if (isOwned) {
        ctx.fillStyle = SHOP.good;
        fillFit('OWNED', midX, priceY, maxW, 24, 16);
    } else if (isMaxed) {
        ctx.fillStyle = SHOP.good;
        fillFit('MAXED OUT', midX, priceY, maxW, 24, 16);
    } else {
        ctx.fillStyle = isLocked ? SHOP.dim : isBroke ? SHOP.bad : SHOP.gold;
        fillFit(`PRICE: ${item.cost} GOLD`, midX, priceY, maxW, 24, 16);
    }

    // Status line (bottom)
    let statusText = '', statusColor = SHOP.subtext;
    if (isOwned)        { statusText = '✔ You have this'; statusColor = SHOP.good; }
    else if (isMaxed)   { statusText = '✔ Can\'t carry any more'; statusColor = SHOP.good; }
    else if (isLocked)  { statusText = '🔒 ' + (item.lockMsg || ('Reach Level ' + item.levelReq)); statusColor = SHOP.dim; }
    else if (isBroke)   { statusText = `Need ${item.cost - player.gold} more gold`; statusColor = SHOP.bad; }
    else if (isBuyable) { statusText = highlighted ? 'Press ENTER or click to buy' : 'Click to buy'; statusColor = SHOP.text; }
    ctx.fillStyle = statusColor;
    fillFit(statusText, midX, cy + ch - 18, maxW, 18, 13);

    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function renderOopsConfirm(PX, PY, PW, PH, cx) {
    ctx.fillStyle='rgba(0,0,0,0.85)';
    ctx.fillRect(PX, PY, PW, PH);
    const boxW=380, boxH=140;
    const boxX=Math.floor(cx-boxW/2), boxY=Math.floor(PY+PH/2-boxH/2);
    ctx.fillStyle='#000000'; ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle=SHOP.text; ctx.lineWidth=2;
    ctx.strokeRect(boxX+1, boxY+1, boxW-2, boxH-2);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='20px VT323, monospace'; ctx.fillStyle=SHOP.text;
    ctx.fillText('Reset all purchases from this shop visit?', cx, boxY+26);
    ctx.font='17px VT323, monospace'; ctx.fillStyle=SHOP.subtext;
    ctx.fillText('Your gold and items go back to how they were.', cx, boxY+52);
    const btnW=140, btnH=32, btnY=boxY+boxH-btnH-14;
    const yesX=cx-btnW-8, noX=cx+8;
    ctx.fillStyle='#1a0000'; ctx.fillRect(yesX, btnY, btnW, btnH);
    ctx.strokeStyle=SHOP.bad; ctx.lineWidth=1; ctx.strokeRect(yesX+0.5, btnY+0.5, btnW-1, btnH-1);
    ctx.font='19px VT323, monospace'; ctx.fillStyle=SHOP.bad;
    ctx.fillText('[Y] Yes, Reset', yesX+btnW/2, btnY+btnH/2);
    ctx.fillStyle='#111111'; ctx.fillRect(noX, btnY, btnW, btnH);
    ctx.strokeStyle=SHOP.text; ctx.strokeRect(noX+0.5, btnY+0.5, btnW-1, btnH-1);
    ctx.fillStyle=SHOP.text;
    ctx.fillText('[N] Keep Items', noX+btnW/2, btnY+btnH/2);
    shopUi.confirmYesRect = { x:yesX, y:btnY, w:btnW, h:btnH };
    shopUi.confirmNoRect  = { x:noX,  y:btnY, w:btnW, h:btnH };
}

function renderShop(now) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = SHOP.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);

    const PW = Math.min(580, canvas.width - 10);
    const PH = Math.min(canvas.height - 10, 560);
    const PX = Math.floor((canvas.width - PW) / 2);
    const PY = Math.floor((canvas.height - PH) / 2);
    const cx = PX + PW / 2;

    // ── HEADER ─────────────────────────────────────────
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '30px VT323, monospace'; ctx.fillStyle = SHOP.text;
    ctx.fillText('THE DEAD END EMPORIUM', cx, PY + 18);

    // Gold/level banner with animated tick
    const goldElapsed = now - shopUi.goldFlashAt;
    const GOLD_ANIM = 600;
    let displayGold = player.gold;
    if (goldElapsed < GOLD_ANIM && shopUi.goldFlashFrom > player.gold) {
        displayGold = Math.round(shopUi.goldFlashFrom + (player.gold - shopUi.goldFlashFrom) * (goldElapsed / GOLD_ANIM));
    }
    ctx.font = '24px VT323, monospace';
    ctx.fillStyle = SHOP.gold;
    ctx.fillText(`YOUR GOLD: ${displayGold}      YOUR LEVEL: ${player.playerLevel}`, cx, PY + 48);

    // ── TAB BAR ────────────────────────────────────────
    const TABS = [
        { id:'WEAPONS', label:'⚔️ Weapons' },
        { id:'ARMOR',   label:'🛡️ Armor'   },
        { id:'ITEMS',   label:'🎒 Items'   },
        { id:'UPGRADES',label:'🔦 Lights'  },
    ];
    const tabBarY = PY + 68;
    const tabH = 34;
    const tabW = Math.floor(PW / TABS.length);
    shopUi.tabRects = [];
    for (let ti = 0; ti < TABS.length; ti++) {
        const tab = TABS[ti];
        const tx = PX + ti * tabW;
        const isActive = shopUi.tab === tab.id;
        ctx.fillStyle = isActive ? '#222222' : SHOP.bg;
        ctx.fillRect(tx, tabBarY, tabW, tabH);
        ctx.strokeStyle = SHOP.line; ctx.lineWidth = 1;
        ctx.strokeRect(tx + 0.5, tabBarY + 0.5, tabW - 1, tabH - 1);
        if (isActive) { ctx.fillStyle = SHOP.gold; ctx.fillRect(tx + 1, tabBarY + tabH - 4, tabW - 2, 3); }
        ctx.font = '20px VT323, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = isActive ? SHOP.text : SHOP.dim;
        ctx.fillText(tab.label, tx + tabW / 2, tabBarY + tabH / 2);
        shopUi.tabRects.push({ x:tx, y:tabBarY, w:tabW, h:tabH, id:tab.id });
    }

    // ── QUADRANT GRID ──────────────────────────────────
    const gridTop    = PY + 110;
    const gridBottom = PY + PH - 88;
    const gridH      = gridBottom - gridTop;
    const cardGap    = 8;
    const cardW      = Math.floor((PW - 40) / 2);
    const cardH      = Math.floor((gridH - cardGap) / 2);
    const cardX0     = PX + 12;

    const cardPositions = [
        { x: cardX0,                   y: gridTop },
        { x: cardX0 + cardW + cardGap, y: gridTop },
        { x: cardX0,                   y: gridTop + cardH + cardGap },
        { x: cardX0 + cardW + cardGap, y: gridTop + cardH + cardGap },
    ];

    const items = getTabItems();

    // Pagination arrows (weapons/armor may have >4)
    const totalItems = (() => {
        if (shopUi.tab === 'WEAPONS') return WEAPONS.length;
        if (shopUi.tab === 'ARMOR')   return ARMORS.length;
        return 4;
    })();
    const totalPages = Math.ceil(totalItems / 4);
    shopUi.prevPageRect = null;
    shopUi.nextPageRect = null;
    if (totalPages > 1) {
        const arrowY = gridTop + gridH / 2;
        ctx.font = '26px VT323, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = SHOP.gold;
        if (shopUi.page > 0) {
            ctx.fillText('◀', PX + 5, arrowY);
            shopUi.prevPageRect = { x:PX-4, y:arrowY-20, w:18, h:40 };
        }
        if (shopUi.page < totalPages - 1) {
            ctx.fillText('▶', PX + PW - 5, arrowY);
            shopUi.nextPageRect = { x:PX+PW-14, y:arrowY-20, w:18, h:40 };
        }
        ctx.font = '17px VT323, monospace';
        ctx.fillStyle = SHOP.subtext;
        ctx.fillText(`Page ${shopUi.page + 1} of ${totalPages}  (click ◀ ▶ or press , .)`, cx, gridBottom + 12);
    }

    shopUi.cardRects = [];
    for (let i = 0; i < 4; i++) {
        const pos = cardPositions[i];
        const item = items[i] || null;
        if (item) {
            drawQuadCard(pos.x, pos.y, cardW, cardH, item, shopUi.selectedCard === i, now);
            shopUi.cardRects.push({ x:pos.x, y:pos.y, w:cardW, h:cardH, idx:i });
        }
    }

    // ── FOOTER ─────────────────────────────────────────
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = SHOP.subtext;
    fillFit(
        `Next maze: Level ${nextLevel.level}  ·  ${nextLevel.gridSize}x${nextLevel.gridSize}  ·  ` +
        `Zombie HP ${nextLevel.zombieHp}  ·  Zombie DMG ${nextLevel.zombieDmg}` +
        (nextLevel.extraGuards > 0 ? `  ·  +${nextLevel.extraGuards} guard` : ''),
        cx, PY + PH - 52, PW - 20, 17, 13
    );

    const btnY = PY + PH - 34;
    const hasPurchase = hasMadePurchase();
    const oopsW = 170, oopsH = 30, oopsX = PX + 10;
    shopUi.oopsRect = { x:oopsX, y:btnY, w:oopsW, h:oopsH };
    ctx.fillStyle = SHOP.bg;
    ctx.fillRect(oopsX, btnY, oopsW, oopsH);
    ctx.strokeStyle = hasPurchase ? SHOP.text : '#333333'; ctx.lineWidth = 1;
    ctx.strokeRect(oopsX + 0.5, btnY + 0.5, oopsW - 1, oopsH - 1);
    ctx.font = '19px VT323, monospace';
    ctx.fillStyle = hasPurchase ? SHOP.text : '#555555';
    ctx.fillText('↩ Oops! Undo', oopsX + oopsW / 2, btnY + oopsH / 2);

    const nlX = oopsX + oopsW + 12;
    const nlW = PX + PW - 10 - nlX;
    const pulse = 0.7 + 0.3 * Math.sin(now * 0.003);
    shopUi.nextLevelRect = { x:nlX, y:btnY, w:nlW, h:oopsH };
    ctx.fillStyle = '#0a1a0a'; ctx.fillRect(nlX, btnY, nlW, oopsH);
    ctx.strokeStyle = `rgba(68,255,136,${pulse})`; ctx.lineWidth = 1.5;
    ctx.strokeRect(nlX + 0.75, btnY + 0.75, nlW - 1.5, oopsH - 1.5);
    ctx.font = '20px VT323, monospace';
    ctx.fillStyle = SHOP.good;
    ctx.fillText('[ SPACE ]  NEXT MAZE  >', nlX + nlW / 2, btnY + oopsH / 2);

    // "Purchases reset!" flash
    const oopsFlashElapsed = now - shopUi.oopsFlashAt;
    if (oopsFlashElapsed < 1800) {
        const alpha = oopsFlashElapsed < 1400 ? 1 : 1 - (oopsFlashElapsed - 1400) / 400;
        ctx.font = '18px VT323, monospace'; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
        ctx.fillStyle = `rgba(255,221,68,${alpha})`;
        ctx.fillText('Purchases undone!', PX + PW - 6, PY + 2);
    }

    // Oops confirm overlay
    if (shopUi.oopsConfirm) renderOopsConfirm(PX, PY, PW, PH, cx);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  GAME OVER  (enhanced)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderGameOver(now) {
    ctx.fillStyle='rgba(0,0,0,0.92)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const cx=canvas.width/2, cy=canvas.height/2;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='74px VT323, monospace'; ctx.fillStyle=C.gameOverTitle;
    ctx.shadowColor='#ff0000'; ctx.shadowBlur=32;
    ctx.fillText('GAME OVER', cx, cy-72); ctx.shadowBlur=0;
    ctx.font='26px VT323, monospace'; ctx.fillStyle=C.gameOverText;
    ctx.fillText(`DIED ON LEVEL ${run.level}`, cx, cy-22);
    ctx.font='22px VT323, monospace'; ctx.fillStyle='#ccaa33';
    ctx.shadowColor='#aa8800'; ctx.shadowBlur=6;
    ctx.fillText(`GOLD COLLECTED:  ${player.gold}G`, cx, cy+10); ctx.shadowBlur=0;
    ctx.font='16px VT323, monospace'; ctx.fillStyle=C.gameOverSub;
    ctx.fillText('the dead ends claim another soul...', cx, cy+34);

    const pulse=0.55+0.45*Math.sin(now*0.003);
    const bW=180, bH=34;
    const retryX=cx-bW/2, retryY=cy+56;
    const menuX=cx-bW/2,  menuY=cy+98;

    ctx.fillStyle='rgba(18,0,0,0.9)'; ctx.fillRect(retryX,retryY,bW,bH);
    ctx.strokeStyle=`rgba(200,30,30,${pulse})`; ctx.lineWidth=1;
    ctx.strokeRect(retryX+0.5,retryY+0.5,bW-1,bH-1);
    ctx.font='22px VT323, monospace'; ctx.fillStyle=`rgba(180,50,50,${pulse})`;
    ctx.shadowColor='#cc0000'; ctx.shadowBlur=pulse*10;
    ctx.fillText('[ R ]  TRY AGAIN', cx, retryY+bH/2); ctx.shadowBlur=0;

    ctx.fillStyle='rgba(10,8,0,0.9)'; ctx.fillRect(menuX,menuY,bW,bH);
    ctx.strokeStyle=`rgba(140,110,40,${pulse*0.85})`; ctx.lineWidth=1;
    ctx.strokeRect(menuX+0.5,menuY+0.5,bW-1,bH-1);
    ctx.font='20px VT323, monospace'; ctx.fillStyle=`rgba(120,100,60,${pulse*0.85})`;
    ctx.fillText('[ M ]  MAIN MENU', cx, menuY+bH/2);

    uiRects.gameOverRetry = {x:retryX, y:retryY, w:bW, h:bH};
    uiRects.gameOverMenu  = {x:menuX,  y:menuY,  w:bW, h:bH};
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  PAUSE SCREEN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderPaused(now) {
    ctx.fillStyle='rgba(0,0,0,0.76)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const cx=canvas.width/2, cy=canvas.height/2;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='54px VT323, monospace'; ctx.fillStyle='#00ff41';
    ctx.shadowColor='#00ff41'; ctx.shadowBlur=20;
    ctx.fillText('PAUSED', cx, cy-52); ctx.shadowBlur=0;
    ctx.font='16px VT323, monospace'; ctx.fillStyle='#446644';
    ctx.fillText(`MAZE ${run.level}  ·  PLR LVL ${player.playerLevel}  ·  GOLD ${player.gold}G  ·  KILLS ${player.totalZombiesKilled}`, cx, cy-16);

    const bW=200, bH=36;
    const resumeX=cx-bW/2, resumeY=cy+12;
    const quitX=cx-bW/2, quitY=cy+56;

    const pulse=0.6+0.4*Math.sin(now*0.003);
    ctx.fillStyle='rgba(0,12,0,0.9)'; ctx.fillRect(resumeX,resumeY,bW,bH);
    ctx.strokeStyle=`rgba(0,255,65,${pulse})`; ctx.lineWidth=1;
    ctx.strokeRect(resumeX+0.5,resumeY+0.5,bW-1,bH-1);
    ctx.font='22px VT323, monospace'; ctx.fillStyle=`rgba(0,255,65,${pulse})`;
    ctx.shadowColor='#00ff41'; ctx.shadowBlur=pulse*8;
    ctx.fillText('[ R / ESC ]  RESUME', cx, resumeY+bH/2); ctx.shadowBlur=0;

    ctx.fillStyle='rgba(12,8,0,0.9)'; ctx.fillRect(quitX,quitY,bW,bH);
    ctx.strokeStyle='#aa8800'; ctx.lineWidth=1;
    ctx.strokeRect(quitX+0.5,quitY+0.5,bW-1,bH-1);
    ctx.font='20px VT323, monospace'; ctx.fillStyle='#ccaa33';
    ctx.shadowColor='#aa8800'; ctx.shadowBlur=6;
    ctx.fillText('[ Q ]  SAVE & QUIT', cx, quitY+bH/2); ctx.shadowBlur=0;

    ctx.font='13px VT323, monospace'; ctx.fillStyle='#2a4a2a';
    ctx.fillText('saves at maze boundaries - you will restart this maze on continue', cx, quitY+bH+18);

    uiRects.pauseResume = {x:resumeX, y:resumeY, w:bW, h:bH};
    uiRects.pauseQuit   = {x:quitX,   y:quitY,   w:bW, h:bH};
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  SLOT SELECT SCREEN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderSlotSelect(now) {
    const slots = loadAllSlots();
    ctx.fillStyle = C.background; ctx.fillRect(0,0,canvas.width,canvas.height);

    // Background rain effect
    for (let i=0; i<5; i++) {
        const hx = canvas.width*0.1 + i*(canvas.width*0.2);
        const hy = (Math.sin(now*0.0006+i*1.4)*0.5+0.5)*(canvas.height*0.5)+10;
        ctx.fillStyle=`rgba(0,180,50,${0.04+i%3*0.015})`;
        ctx.fillRect(hx-1,0,2,hy);
    }

    const cx=canvas.width/2;
    const flicker=0.82+0.18*Math.sin(now*0.011)*Math.sin(now*0.007);
    ctx.font='42px VT323, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=`rgba(0,255,65,${flicker})`; ctx.shadowColor='#00ff41'; ctx.shadowBlur=20*flicker;
    ctx.fillText('DEAD ENDS', cx, 44); ctx.shadowBlur=0;
    ctx.font='14px VT323, monospace'; ctx.fillStyle='#1a3a1a';
    ctx.fillText('SELECT SAVE SLOT', cx, 68);

    const cardW=176, cardH=194, cardGap=12;
    const totalW=3*cardW+2*cardGap;
    const startX=Math.floor((canvas.width-totalW)/2);
    const cardY=82;

    for (let i=0; i<3; i++) {
        const slot=slots[i];
        const elapsed=Math.max(0,now-(setupFlow.slotAnimStart+i*100));
        const slideT=Math.min(1,elapsed/280);
        const ease=slideT*slideT*(3-2*slideT);
        const offX=(1-ease)*90;
        const sx=startX+i*(cardW+cardGap)+offX;
        const isSelected=setupFlow.selectedSlot===i;

        const tc=slot?TIER_CONFIG[slot.playerTier]:null;
        const borderCol=isSelected?(tc?tc.glow:'#00ff41'):'#1a2a1a';
        const borderW=isSelected?2:1;

        ctx.fillStyle=isSelected?'rgba(0,20,0,0.96)':'rgba(0,8,0,0.72)';
        ctx.fillRect(sx,cardY,cardW,cardH);
        ctx.strokeStyle=borderCol; ctx.lineWidth=borderW;
        if(isSelected){ctx.shadowColor=borderCol;ctx.shadowBlur=10;}
        ctx.strokeRect(sx+1,cardY+1,cardW-2,cardH-2); ctx.shadowBlur=0;

        ctx.font='11px VT323, monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.fillStyle='#223322';
        ctx.fillText(`[${i+1}]`,sx+5,cardY+5);
        ctx.textAlign='center'; ctx.textBaseline='middle';
        const ccx=sx+cardW/2;

        // Store card rect (actual rendered x, accounting for slide animation)
        slotSelectUi.cardRects[i] = {x:sx, y:cardY, w:cardW, h:cardH, idx:i};

        if(slot){
            ctx.font='14px VT323, monospace'; ctx.fillStyle=tc.color;
            ctx.shadowColor=tc.glow; ctx.shadowBlur=isSelected?8:0;
            ctx.fillText(tc.emoji+'  '+tc.name,ccx,cardY+28); ctx.shadowBlur=0;
            ctx.font='16px VT323, monospace'; ctx.fillStyle='#aaddaa';
            ctx.fillText(slot.name.toUpperCase(),ccx,cardY+52);
            ctx.font='12px VT323, monospace'; ctx.fillStyle='#335533';
            ctx.fillText(tc.grade+'  |  '+(LEARNING_MODES.find(m=>m.id===slot.learningMode)||LEARNING_MODES[0]).label,ccx,cardY+68);
            ctx.fillStyle='#334a33';
            ctx.fillText(`MAZE ${slot.mazeLevel}  |  LVL ${slot.playerLevel}`,ccx,cardY+84);
            ctx.fillText(`GOLD ${slot.gold}G  |  KILLS ${slot.totalZombiesKilled}`,ccx,cardY+99);
            drawCharacterSprite(CHARACTERS[getCharacterIdx(slot.character)].id, 'south', ccx, cardY+138, 64, 0);
            // Trash button (top-right corner)
            const trX=sx+cardW-26, trY=cardY+4, trW=22, trH=18;
            ctx.fillStyle='rgba(40,8,8,0.85)'; ctx.fillRect(trX,trY,trW,trH);
            ctx.strokeStyle='#662222'; ctx.lineWidth=1; ctx.strokeRect(trX+0.5,trY+0.5,trW-1,trH-1);
            ctx.font='11px VT323, monospace'; ctx.fillStyle='#cc3333';
            ctx.fillText('[X]',trX+trW/2,trY+trH/2);
            slotSelectUi.trashRects[i] = {x:trX, y:trY, w:trW, h:trH, idx:i};
            // Play hint
            ctx.font='12px VT323, monospace'; ctx.fillStyle=isSelected?'#00dd44':'#2a5a2a';
            ctx.fillText(isSelected?'[ CLICK TO PLAY ]':'click to play',ccx,cardY+cardH-12);
        } else {
            ctx.font='28px VT323, monospace'; ctx.fillStyle='#1a3a1a';
            ctx.fillText('. . .',ccx,cardY+66);
            ctx.font='13px VT323, monospace'; ctx.fillStyle='#2a4a2a';
            ctx.fillText(`SLOT ${i+1}`,ccx,cardY+94);
            ctx.fillText('EMPTY',ccx,cardY+110);
            ctx.font='12px VT323, monospace'; ctx.fillStyle=isSelected?'#00dd44':'#2a5a2a';
            ctx.fillText(isSelected?'[ CLICK TO CREATE ]':'click to create',ccx,cardY+cardH-12);
            slotSelectUi.trashRects[i] = null;
        }
    }

    const pulse=0.6+0.4*Math.sin(now*0.003);
    ctx.font='13px VT323, monospace'; ctx.fillStyle=`rgba(0,200,50,${pulse})`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('CLICK A SLOT TO PLAY  |  [X] TO DELETE',cx,cardY+cardH+22);

    // Delete confirm overlay
    if (slotSelectUi.deleteConfirmSlot >= 0) {
        const dslot = loadAllSlots()[slotSelectUi.deleteConfirmSlot];
        const name = dslot ? dslot.name : '?';
        ctx.fillStyle='rgba(0,0,0,0.80)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        const bW=340, bH=120, bX=Math.floor(cx-bW/2), bY=Math.floor(canvas.height/2-bH/2);
        ctx.fillStyle='#0a0404'; ctx.fillRect(bX,bY,bW,bH);
        ctx.strokeStyle='#cc3333'; ctx.lineWidth=1.5; ctx.strokeRect(bX+1,bY+1,bW-2,bH-2);
        ctx.font='15px VT323, monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#ffaaaa';
        ctx.fillText(`Delete ${name}'s adventure?`, cx, bY+24);
        ctx.font='12px VT323, monospace'; ctx.fillStyle='#664444';
        ctx.fillText('This cannot be undone.', cx, bY+44);
        const btnW=120, btnH=30, btnY=bY+bH-btnH-10;
        const yesX=cx-btnW-8, noX=cx+8;
        ctx.fillStyle='#1a0808'; ctx.fillRect(yesX,btnY,btnW,btnH);
        ctx.strokeStyle='#cc2222'; ctx.lineWidth=1; ctx.strokeRect(yesX+0.5,btnY+0.5,btnW-1,btnH-1);
        ctx.font='15px VT323, monospace'; ctx.fillStyle='#ff4444';
        ctx.fillText('Yes, Delete', yesX+btnW/2, btnY+btnH/2);
        ctx.fillStyle='#081408'; ctx.fillRect(noX,btnY,btnW,btnH);
        ctx.strokeStyle='#336633'; ctx.lineWidth=1; ctx.strokeRect(noX+0.5,btnY+0.5,btnW-1,btnH-1);
        ctx.fillStyle='#55cc55'; ctx.fillText('Cancel', noX+btnW/2, btnY+btnH/2);

//  SPAWNING
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function buildReservedCells(maze) {
    const r = new Set();
    for (let c=0; c<maze.size; c++)
        for (let row=0; row<maze.size; row++)
            if (c + row <= 2) r.add(`${c},${row}`);
    r.add(`${maze.exitCol},${maze.exitRow}`);
    return r;
}

function spawnZombies(maze, extraGuards, chestMap, reserved) {
    const map = new Map();
    for (const row of maze.grid)
        for (const cell of row) {
            const key=`${cell.col},${cell.row}`;
            if (cell.isDeadEnd && !reserved.has(key))
                map.set(key, { col:cell.col, row:cell.row, hp:run.zombieHp, maxHp:run.zombieHp });
        }

    if (extraGuards > 0) {
        const eligible=[];
        for (const row of maze.grid)
            for (const cell of row) {
                const key=`${cell.col},${cell.row}`;
                if (!cell.isDeadEnd && !reserved.has(key) && !map.has(key) && !chestMap.has(key))
                    eligible.push(cell);
            }
        for (let i=eligible.length-1; i>0; i--) {
            const j=Math.floor(Math.random()*(i+1));
            [eligible[i],eligible[j]]=[eligible[j],eligible[i]];
        }
        for (let i=0; i<Math.min(extraGuards,eligible.length); i++) {
            const cell=eligible[i], key=`${cell.col},${cell.row}`;
            map.set(key, { col:cell.col, row:cell.row, hp:run.zombieHp, maxHp:run.zombieHp });
        }
    }
    return map;
}

// One random zombie carries the exit key. If a maze somehow has no zombies,
// spawn a guard so there's always someone to fight for it.
function assignKeyZombie(maze, chestMap, reserved) {
    if (zombies.size === 0) {
        const eligible = [];
        for (const row of maze.grid)
            for (const cell of row) {
                const key = `${cell.col},${cell.row}`;
                if (!reserved.has(key) && !chestMap.has(key)) eligible.push(cell);
            }
        const cell = eligible[Math.floor(Math.random() * eligible.length)];
        if (cell) zombies.set(`${cell.col},${cell.row}`,
            { col:cell.col, row:cell.row, hp:run.zombieHp, maxHp:run.zombieHp });
    }
    const all = [...zombies.values()];
    if (all.length > 0) all[Math.floor(Math.random() * all.length)].hasKey = true;
}

function spawnChests(maze, reserved) {
    const eligible=[];
    for (const row of maze.grid)
        for (const cell of row) {
            const key=`${cell.col},${cell.row}`;
            if (!cell.isDeadEnd && !reserved.has(key)) eligible.push(cell);
        }
    for (let i=eligible.length-1; i>0; i--) {
        const j=Math.floor(Math.random()*(i+1));
        [eligible[i],eligible[j]]=[eligible[j],eligible[i]];
    }
    const count=randInt(CK.countMin, CK.countMax), map=new Map();
    for (let i=0; i<Math.min(count,eligible.length); i++) {
        const cell=eligible[i];
        map.set(`${cell.col},${cell.row}`, { col:cell.col, row:cell.row });
    }
    return map;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  LOOT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function rollLoot() {
    const w=CK.lootWeights;
    const rf = player.rabbitFeet;
    // Rabbit's foot gold bonuses (cumulative)
    let goldMin = CK.goldMin, goldMax = CK.goldMax;
    if (rf >= 1) { goldMin += 5; goldMax += 5; }
    if (rf >= 2) { goldMin += 5; goldMax += 5; }
    if (rf >= 4) { goldMin += 5; goldMax += 5; }
    // Rabbit's foot potion weight bonus at rf>=2
    const potionBonus = rf >= 2 ? 5 : 0;
    const goldW  = w.gold;
    const potW   = w.potion + potionBonus;

    let roll = Math.random() * 100;

    // RF>=5: TODO: 5-foot chest choice UI — fall through to normal loot for now
    if (roll < goldW) {
        const amt=randInt(goldMin, goldMax); player.gold+=amt;
        return { title:`+${amt} GOLD`, subtitle:'COINS CLINK IN YOUR POCKET', color:C.popupGold };
    }
    if (roll < goldW + potW) {
        if (player.potions >= 5) {
            return { title:'INVENTORY FULL', subtitle:'DROP SOMETHING TO CARRY MORE POTIONS', color:C.popupPotion };
        }
        player.potions++;
        syncPotionsHud();
        return { title:'+1 POTION', subtitle:`ADDED TO INVENTORY  (${player.potions}/5)`, color:C.popupPotion };
    }
    // Would be empty
    if (rf >= 3) {
        // Never empty — re-roll as gold
        const amt=randInt(goldMin, goldMax); player.gold+=amt;
        return { title:`+${amt} GOLD`, subtitle:'LUCKY COINS CLINK IN YOUR POCKET', color:C.popupGold };
    }
    const msgs=CK.emptyMessages;
    return { title:'NOTHING', subtitle:msgs[Math.floor(Math.random()*msgs.length)], color:C.popupEmpty };
}

function openChest(key, col, row) {
    chests.delete(key);
    const loot=rollLoot();
    showPopup(loot.title, loot.subtitle, loot.color);
    spawnSparkles(col, row, performance.now());
    playChime();
    syncHpHud(); syncGoldHud(); syncPotionsHud();
}

function genMathProblem() {
    const tier = gameConfig.playerTier;
    const opSets = [['+'], ['+','-'], ['+','-','x'], ['+','-','x','/']];
    const maxVals = [10, 20, 50, 99];
    const ops = opSets[tier];
    const maxV = maxVals[tier];
    const op = ops[Math.floor(Math.random()*ops.length)];
    let a, b, answer;
    if(op==='+')       { a=randInt(1,maxV); b=randInt(1,maxV-a||1); answer=a+b; }
    else if(op==='-')  { b=randInt(1,maxV); a=randInt(b,maxV); answer=a-b; }
    else if(op==='x')  { a=randInt(1,12); b=randInt(1,12); answer=a*b; }
    else               { b=randInt(1,12); answer=randInt(1,12); a=b*answer; }
    return { problem:`${a} ${op} ${b} =`, answer };
}

function genColorChallenge() {
    const tier = gameConfig.playerTier;
    // TODO: Tier 4 Color/Shape replacement needed
    const effectiveTier = Math.min(tier, 2);
    const correct = COLOR_NAMES[Math.floor(Math.random()*COLOR_NAMES.length)];
    const wrongs = COLOR_NAMES.filter(c=>c!==correct);
    for(let i=wrongs.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));[wrongs[i],wrongs[j]]=[wrongs[j],wrongs[i]];
    }
    const numOpts = effectiveTier>=1 ? 4 : 3;
    const opts = [correct,...wrongs.slice(0,numOpts-1)];
    for(let i=opts.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];
    }

    if(effectiveTier===0){
        return {
            type:'SWATCH', swatchColor:COLOR_DATA[correct], correctWord:correct,
            options:opts.map(c=>({word:c,correct:c===correct}))
        };
    } else {
        const inkName = COLOR_NAMES[Math.floor(Math.random()*COLOR_NAMES.length)];
        const dispWord = COLOR_NAMES[Math.floor(Math.random()*COLOR_NAMES.length)];
        const prompt = effectiveTier>=2 ? 'CLICK THE INK COLOR (ignore the word)' : 'CLICK THE COLOR OF THE INK';
        return {
            type:'STROOP', displayWord:dispWord, inkCss:COLOR_DATA[inkName], correctAnswer:inkName,
            prompt,
            options:opts.map(c=>({word:c,correct:c===inkName}))
        };
    }
}

    else if(mode==='MATH')  pickNewMath();
